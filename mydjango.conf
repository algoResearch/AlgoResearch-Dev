#user nobody;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Log settings
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Server block for Django application
    server {
        listen 80;  # HTTP port
        server_name example.com www.example.com;  # Replace with your domain

        # Proxy settings pointing to Gunicorn
        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:8000;  # Ensure this points to the port where Gunicorn is running
            proxy_redirect off;
        }

        # Handling static files
        location /static/ {
            alias /path/to/your/staticfiles/;  # Ensure this path is correct
        }

        # Handling media files
        location /media/ {
            alias /path/to/your/mediafiles/;  # Ensure this path is correct
        }

        # Custom error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # Include server configurations from other files
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}


