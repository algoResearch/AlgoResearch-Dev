name: CD - Build & Push (GHCR & DockerHub)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required for GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        id: image
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/algoresearch-dev" >> $GITHUB_OUTPUT
          echo "dockerhub=${{ secrets.DOCKERHUB_USERNAME }}/algoresearch-dev" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate build-time Fernet key
        id: fernet
        run: |
          FERNET_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "key=$FERNET_KEY" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            FERNET_KEY=${{ steps.fernet.outputs.key }}
          tags: |
            ${{ steps.image.outputs.ghcr }}:latest
            ${{ steps.image.outputs.ghcr }}:${{ github.sha }}
            ${{ steps.image.outputs.dockerhub }}:latest
            ${{ steps.image.outputs.dockerhub }}:${{ github.sha }}
