name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DEV_DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: algoresearch.settings.dev # matches your Dockerfile
      SECRET_KEY: test-secret
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          pip install -U pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-django model-bakery aiofiles

      - name: Generate Fernet Key
        run: |
          FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "FERNET_KEY=$FERNET_KEY" >> $GITHUB_ENV

      - name: Lint
        run: flake8 .

      - name: Merge migrations if needed
        env:
          DEV_DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
        run: |
          python manage.py makemigrations --merge --noinput || true

      - name: Migrate & test
        env:
          DEV_DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
        run: |
          python manage.py migrate --noinput
          pytest -q
