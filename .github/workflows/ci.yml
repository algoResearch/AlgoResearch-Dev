name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: algoresearch.settings.dev
      REDIS_URL: redis://127.0.0.1:6379/0
      LOADTEST_SECRET: super-secret-loadtest-key
      USE_INMEMORY_CHANNELS: "0"
      CELERY_EAGER: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run lint (flake8)
        run: flake8

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run unit tests
        run: |
          pytest -q

      - name: Run WS integration smoke tests
        run: |
          python manage.py create_loadtest_users --count 10
          python manage.py send_test_notifications --count 2
          python ci/ws_smoke_test.py
