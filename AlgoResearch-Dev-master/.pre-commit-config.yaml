# Run:  pre-commit install && pre-commit install --hook-type pre-push
# Tip:  pre-commit run --all-files

repos:
  # --- Essential hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # --- Python lint + format (ruff: fast, one tool) ---------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Security: secret scanning (baseline required) -------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        stages: [commit]

  # --- Optional: static security checks (Bandit) -----------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-q", "-r", "dashboard", "-x", "tests"]
        additional_dependencies: ["bandit[toml]"]

  # --- Local policy hooks ----------------------------------------------------
  # Block committing .env files (except samples)
  - repo: local
    hooks:
      - id: block-env-files
        name: Block committing .env / secrets files
        entry: bash -c 'echo "Refusing to commit .env / secrets file. Use .env.example instead." >&2; exit 1'
        language: system
        files: '(^|/)\.env(\..*)?$'
        exclude: '(^|/)\.env\.example$|(^|/)example\.env$'

      # Prevent accidental edits to production settings unless explicitly allowed
      - id: protect-prod-settings
        name: Protect production settings from accidental commits
        entry: bash -c 'if git diff --cached --name-only | grep -E "^algoresearch/settings/prod\.py$" >/dev/null; then echo "Changes to prod.py are blocked. Set ALLOW_PROD_CHANGES=1 to override for this commit." >&2; test "$ALLOW_PROD_CHANGES" = "1" || exit 1; fi'
        language: system
        pass_filenames: false

      # On push: fast sanity checks. Keep these lightweight.
      - id: django-check
        name: Django system check (dev)
        entry: bash -c 'python manage.py check --settings=algoresearch.settings.dev'
        language: system
        pass_filenames: false
        stages: [push]

      - id: django-migrations-check
        name: Django migrations up-to-date
        entry: bash -c 'python manage.py makemigrations --check --dry-run --settings=algoresearch.settings.dev'
        language: system
        pass_filenames: false
        stages: [push]

      # Optional test gate on push (uncomment if desired)
      # - id: pytest
      #   name: Run tests (quick)
      #   entry: bash -c 'pytest -q'
      #   language: system
      #   pass_filenames: false
      #   stages: [push]
