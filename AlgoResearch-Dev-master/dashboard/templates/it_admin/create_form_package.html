{% extends "it_admin/it_admin_base_dashboard.html" %}
{% block title %}Create Form Package{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Create New Form Package</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="name" class="form-label">Package Name</label>
            <input type="text" name="name" id="name" class="form-control" required>
        </div>

        

        <div class="mb-3">
            <label class="form-label">Select Form Templates</label>
            {% for form_type, path, label in form_templates %}
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="form_templates" value="{{ path }}" id="{{ path }}">
                    <label class="form-check-label" for="{{ path }}">{{ label }}</label>
                </div>
            {% endfor %}
        </div>
        

        <button type="submit" class="btn btn-primary">Create Package</button>
        <a href="{% url 'it_admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
