{% extends "base/base.html" %}

{% block title %}Update Experiment{% endblock %}

{% block content %}
<div class="container">
    <h2>Update Experiment: {{ experiment.name }}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>
{% endblock %}
