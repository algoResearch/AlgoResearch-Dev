{% load custom_filters %}

<!-- Add Funding Button -->
<button type="button" class="btn btn-outline-primary mb-3" data-bs-toggle="modal" data-bs-target="#addFundingModal">
    Add Funding Source
</button>

<!-- Question 1: Source of Funding Table -->
<h5 class="mt-4">Question 1: Source of Funding</h5>
<div id="funding-entries" class="mb-4">
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Project Name</th>
                <th>PI</th>
                <th>Sponsor</th>
                <th>Sponsor #</th>
                <th>Proposal #</th>
            </tr>
        </thead>
        <tbody id="funding-tbody">
            <tr class="text-muted text-center" id="no-entries-row">
                <td colspan="5">No funding sources added yet.</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Funding Save Form (Question 2 and Hidden Inputs) -->
<form method="POST" id="fundingSaveForm">
    {% csrf_token %}
    
    <h5 class="mt-4">Question 2: Additional Information or Proposal Number</h5>
    <div class="mb-3">
        <label for="id_funding_additional_info" class="form-label">Provide any additional details here</label>
        {{ funding_form.funding_additional_info }}
    </div>

    <input type="hidden" name="funding_json" id="fundingJson">
    <input type="hidden" name="save_funding_info" value="1">

    <button type="button" class="btn btn-success mt-3" onclick="submitFunding()">Save and Continue</button>
</form>

<!-- Add Funding Modal -->
<div class="modal fade" id="addFundingModal" tabindex="-1" aria-labelledby="addFundingModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="fundingForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addFundingModalLabel">Add Funding Source</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Project Name</label>
            <input type="text" name="project_name" class="form-control" required>
        </div>
        <div class="mb-3 position-relative">
            <label class="form-label">Principal Investigator</label>
            <input type="text" id="pi-search" class="form-control" placeholder="Search PI by name, email, or username">
            <div id="pi-results" class="list-group position-absolute w-100 z-3"></div>
        </div>
        <input type="hidden" name="pi_id" id="selected-pi-id">
        <div id="selected-pi-display" class="mb-3 text-muted d-none"></div>

        <div class="mb-3">
            <label class="form-label">Sponsor</label>
            <input type="text" name="sponsor" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Sponsor Number</label>
            <input type="text" name="sponsor_number" class="form-control">
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>
  </div>
</div>
<script>
    let fundingEntries = [];
    fundingEntries = {{ funding_entries_json|safe }};
    updateFundingDisplay();
    document.getElementById('pi-search').addEventListener('input', function () {
        const query = this.value.trim();
        const resultsContainer = document.getElementById('pi-results');
    
        if (!query) {
            resultsContainer.innerHTML = '';
            return;
        }
    
        fetch(`/search-users/?query=${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                resultsContainer.innerHTML = '';
                data.users.forEach(user => {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'list-group-item list-group-item-action';
                    item.textContent = `${user.first_name} ${user.last_name} (${user.username})`;
                    item.onclick = () => {
                        document.getElementById('selected-pi-id').value = user.id;
                        document.getElementById('selected-pi-display').textContent = `Selected PI: ${user.first_name} ${user.last_name}`;
                        document.getElementById('selected-pi-display').classList.remove('d-none');
                        resultsContainer.innerHTML = '';
                        document.getElementById('pi-search').value = '';
                    };
                    resultsContainer.appendChild(item);
                });
            });
    });
    
    document.getElementById('fundingForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        const entry = {
            project_name: formData.get('project_name'),
            sponsor: formData.get('sponsor'),
            sponsor_number: formData.get('sponsor_number'),
            pi_id: formData.get('pi_id'),
            pi_name: document.getElementById('selected-pi-display').textContent.replace('Selected PI: ', ''),
            additional_info: "" // You can collect this per-entry if desired
        };
        fundingEntries.push(entry);
        updateFundingDisplay();
        document.getElementById('fundingForm').reset();
        document.getElementById('selected-pi-display').classList.add('d-none');
        const modalElement = document.getElementById('addFundingModal');
        const modalInstance = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
        modalInstance.hide();

        // Manually remove backdrop in case it persists
        const backdrops = document.querySelectorAll('.modal-backdrop');
        backdrops.forEach(el => el.remove());
        document.body.classList.remove('modal-open');
        document.body.style = '';  // clear inline scroll lock styles
    });
    
    function updateFundingDisplay() {
        const tbody = document.getElementById('funding-tbody');
        const noRow = document.getElementById('no-entries-row');

        tbody.innerHTML = '';

        if (fundingEntries.length === 0) {
            tbody.appendChild(noRow);
            return;
        }

        fundingEntries.forEach(e => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${e.project_name}</td>
                <td>${e.pi_name}</td>
                <td>${e.sponsor}</td>
                <td>${e.sponsor_number}</td>
                <td>${e.additional_info}</td>
            `;
            tbody.appendChild(row);
        });
    }
    function submitFunding() {
        const additionalInfo = document.querySelector('[name="funding_additional_info"]').value;
        document.querySelector('[name="funding_additional_info"]').value = additionalInfo;

        // Serialize funding entries to hidden field
        document.getElementById('fundingJson').value = JSON.stringify(fundingEntries);

        // Submit regular POST form
        document.getElementById('fundingSaveForm').submit();
    }
</script>
