<!-- Consent Forms -->
<h4>Consent Forms</h4>
<button class="btn btn-outline-primary mb-3" data-bs-toggle="modal" data-bs-target="#consentModal">Add Consent Form</button>
<table class="table table-bordered mb-5">
    <thead><tr><th>Name</th><th>Version</th><th>File</th></tr></thead>
    <tbody id="consent-tbody"><tr class="text-muted text-center"><td colspan="3">No consent forms uploaded.</td></tr></tbody>
</table>

<!-- Recruitment Materials -->
<h4>Recruitment Materials</h4>
<button class="btn btn-outline-primary mb-3" data-bs-toggle="modal" data-bs-target="#recruitModal">Add Recruitment Material</button>
<table class="table table-bordered mb-5">
    <thead><tr><th>Name</th><th>Version</th><th>File</th></tr></thead>
    <tbody id="recruit-tbody"><tr class="text-muted text-center"><td colspan="3">No recruitment materials uploaded.</td></tr></tbody>
</table>

<!-- Other Attachments -->
<h4>Other Attachments</h4>
<button class="btn btn-outline-primary mb-3" data-bs-toggle="modal" data-bs-target="#otherModal">Add Other Attachment</button>
<table class="table table-bordered">
    <thead><tr><th>Name</th><th>Version</th><th>Category</th><th>File</th></tr></thead>
    <tbody id="other-tbody"><tr class="text-muted text-center"><td colspan="4">No other attachments uploaded.</td></tr></tbody>
</table>

<!-- Actual Hidden Upload Form -->


<!-- Save Button -->
<!-- Save Button -->
<button class="btn btn-success mt-3" onclick="submitDocuments()">Save and Continue</button>

<!-- Hidden Upload Form -->
<form id="documentUploadForm" method="POST" enctype="multipart/form-data" class="d-none">
    {% csrf_token %}
    <input type="hidden" name="save_documents_info" value="1">
</form>

<!-- Modals -->
{% include "partials/irb_sections/modals/documents_modals.html" %}

<script>
    let consentDocs = [];
    let recruitDocs = [];
    let otherDocs = [];

    function submitDocuments() {
        const form = document.getElementById('documentUploadForm');

        // Form already contains CSRF and save_documents_info

        form.submit();
    }

    function renderTable(id, docs, columns) {
        const tbody = document.getElementById(id);
        tbody.innerHTML = docs.length
            ? docs.map(d =>
                `<tr>${columns.map(c => `<td>${d[c] || ''}</td>`).join('')}<td>${d.file.name}</td></tr>`
              ).join('')
            : `<tr class="text-muted text-center"><td colspan="${columns.length + 1}">No entries.</td></tr>`;
    }

    function createHiddenInput(name, value) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        return input;
    }

    function appendDocumentEntry({ type, name, version, file, category = '', description = '' }) {
        const form = document.getElementById('documentUploadForm');

        form.appendChild(createHiddenInput('document_type[]', type));
        form.appendChild(createHiddenInput('name[]', name));
        form.appendChild(createHiddenInput('version[]', version));
        form.appendChild(createHiddenInput('category[]', category));
        form.appendChild(createHiddenInput('category_description[]', description));

        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.name = 'file[]';

        // Preserve actual file by cloning FileList via DataTransfer (DOM limitation workaround)
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;

        form.appendChild(fileInput);
    }
</script>
