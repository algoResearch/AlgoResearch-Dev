{% extends "admin/base_admin_dashboard.html" %}
{% block title %}IACUC Question{% endblock %}
{% block content %}
<div class="container">
    <h2>Initial Question for Protocol #{{ protocol.id }}</h2>
    <form method="POST">
        {% csrf_token %}
        <p class="mb-3">Will your research involve vertebrate animals or products of vertebrate animals?</p>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="involves_vertebrate_animals" id="yes" value="yes">
            <label class="form-check-label" for="yes">Yes</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="involves_vertebrate_animals" id="no" value="no">
            <label class="form-check-label" for="no">No</label>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Continue</button>
    </form>
</div>
{% endblock %}
