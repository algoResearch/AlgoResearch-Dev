{% extends "admin/base_admin_dashboard.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Project/Performance Site Location(s)</h2>

    <form id="performance-site-form" method="POST" action="{% url 'save_performance_sites' org_id=org_id %}">
        {% csrf_token %}
        
        <div class="row">
            <!-- Site Name -->
            <div class="col-md-12">
                <div class="form-group">
                    <label for="site_name">Site Name <span class="text-danger">*</span></label>
                    <input type="text" name="site_name" id="site_name" class="form-control" required>
                </div>
            </div>

            <!-- Address -->
            <div class="col-md-12">
                <div class="form-group">
                    <label for="address">Address <span class="text-danger">*</span></label>
                    <textarea name="address" id="address" class="form-control" required></textarea>
                </div>
            </div>

            <!-- City -->
            <div class="col-md-4">
                <div class="form-group">
                    <label for="city">City <span class="text-danger">*</span></label>
                    <input type="text" name="city" id="city" class="form-control" required>
                </div>
            </div>

            <!-- State -->
            <div class="col-md-4">
                <div class="form-group">
                    <label for="state">State <span class="text-danger">*</span></label>
                    <input type="text" name="state" id="state" class="form-control" required>
                </div>
            </div>

            <!-- ZIP Code -->
            <div class="col-md-4">
                <div class="form-group">
                    <label for="zip_code">ZIP Code <span class="text-danger">*</span></label>
                    <input type="text" name="zip_code" id="zip_code" class="form-control" required>
                </div>
            </div>

            <!-- Country -->
            <div class="col-md-12">
                <div class="form-group">
                    <label for="country">Country <span class="text-danger">*</span></label>
                    <input type="text" name="country" id="country" class="form-control" required>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="col-md-12">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
