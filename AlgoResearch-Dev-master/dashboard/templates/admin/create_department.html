{% extends "admin/base_admin_dashboard.html" %}
{% block title %}Create Department{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="card shadow-lg border-0 rounded-lg">
        <div class="card-header bg-primary text-white text-center">
            <h3 class="font-weight-light my-3">Create New Department</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success mt-3">Create Department</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
