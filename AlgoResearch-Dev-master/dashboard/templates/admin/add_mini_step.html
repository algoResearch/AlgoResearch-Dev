{% extends "admin/base_admin_dashboard.html" %}
{% block content %}
<div class="container-fluid py-4">
    <div class="card">
        <div class="card-body">
            <h2 class="form-title text-center">Add Mini Step</h2>
            <p class="text-muted text-center">Create a new mini-step for protocol customization.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_name">Mini Step Name</label>
                    {{ form.name }}
                </div>
                <div class="form-group mt-3">
                    <label for="id_required">Required?</label>
                    {{ form.required }}
                </div>
                <div class="form-group mt-3">
                    <label for="id_order">Order</label>
                    {{ form.order }}
                </div>
                <button type="submit" class="btn btn-primary mt-3">Save</button>
                <a href="{% url 'manage_mini_steps' %}" class="btn btn-secondary mt-3">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
