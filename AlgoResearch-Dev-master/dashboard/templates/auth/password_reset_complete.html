{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                135deg,
                rgba(255,255,255,0.15) 0px,
                rgba(255,255,255,0.15) 2px,
                transparent 2px,
                transparent 20px
            );
            z-index: 0;
            pointer-events: none;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #F36C21;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .reset-complete {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            z-index: 1;
        }
        .reset-complete img {
            max-width: 150px;
            margin-bottom: 20px;
        }
        .reset-complete h2 {
            color: #F36C21;
            margin-bottom: 15px;
        }
        .reset-complete p {
            color: #555;
            font-size: 1rem;
        }
        .reset-complete a {
            color: #F36C21;
            text-decoration: none;
            font-weight: bold;
        }
        .reset-complete a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-complete">
        <img src="{% static 'img/login basic.png' %}" alt="algoRhythm Logo">
        <h2>Password Reset Successful</h2>
        <p>Your password has been set. You can now <a href="{% url 'username_entry' %}">log in</a>.</p>
    </div>
</body>
</html>
