        function updateHiddenCode() {
            hiddenCode.value = inputs.map(i => i.value).join('');
        }
        function distributeDigits(digits, startAt = 0) {
            const chars = digits.slice(0, inputs.length - startAt).split('');
            for (let i = 0; i < inputs.length; i++) {
                if (i < startAt) continue;
                    inputs[i].value = chars[i - startAt] || '';
                }
            // focus last filled (or last box if full)
            const lastIndex = Math.min(startAt + chars.length - 1, inputs.length - 1);
            if (lastIndex >= 0) inputs[lastIndex].focus();
            updateHiddenCode();
        }

        // Autofocus first box
        inputs[0].focus();

        // Typing behavior
        inputs.forEach((input, idx) => {
            // If user pastes directly into an input
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const digits = onlyDigits(e.clipboardData.getData('text'));
                if (!digits) return;
                // Fill starting from the first box for a clean overwrite
                distributeDigits(digits, 0);
                // Optional: auto-submit when 6 digits present
                if (hiddenCode.value.length === 6) form.submit();
            });

            input.addEventListener('input', (e) => {
            let v = e.target.value;

            // If mobile/browser shoved multiple chars into one box, spread them
            if (v && v.length > 1) {
                const digits = onlyDigits(v);
                if (digits) distributeDigits(digits, idx);
                return;
            }

            // Keep only a single digit
            e.target.value = onlyDigits(v).slice(0, 1);

            // Move to next if a digit is present
            if (e.target.value && idx < inputs.length - 1) {
                inputs[idx + 1].focus();
            }
            updateHiddenCode();
            });

            input.addEventListener('keydown', (e) => {
                // Backspace: go left when current box empty
                if (e.key === 'Backspace' && !input.value && idx > 0) {
                    inputs[idx - 1].focus();
                    inputs[idx - 1].value = '';
                    updateHiddenCode();
                }
                // Arrow nav
                if (e.key === 'ArrowLeft' && idx > 0) inputs[idx - 1].focus();
                if (e.key === 'ArrowRight' && idx < inputs.length - 1) inputs[idx + 1].focus();
            });

            // Ease: select existing digit on focus so new typing replaces it
            input.addEventListener('focus', () => {
            input.select && input.select();
