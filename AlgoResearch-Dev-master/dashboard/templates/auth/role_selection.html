{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Login Type</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                135deg,
                rgba(255,255,255,0.15) 0px,
                rgba(255,255,255,0.15) 2px,
                transparent 2px,
                transparent 20px
            );
            z-index: 0;
            pointer-events: none;
        }

        body {
            position: relative;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F36C21;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            z-index: 1;
            position: relative;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
        }

        h2 {
            color: #F36C21;
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 20px;
            color: #666;
        }

        form {
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #F36C21;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #ff8800;
        }
    </style>
</head>
<body>
    <div class="login-content">
        <img src="{% static 'img/login basic.png' %}" alt="algoRhythm Logo" class="login-logo">

        <h2>Hello {{ username }} </h2>
        <p>Select your login type:</p>

        {% for label, url_name in roles %}
            <form method="GET" action="{% url url_name %}">
                <input type="hidden" name="username" value="{{ username }}">
                <button type="submit">{{ label }}</button>
            </form>
        {% endfor %}
    </div>
</body>
</html>
