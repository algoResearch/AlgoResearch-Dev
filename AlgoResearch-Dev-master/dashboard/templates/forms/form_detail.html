{% extends "base/base_dashboard.html" %}

{% block title %}{{ form.name }}{% endblock %}
{% block page_title %}{{ form.name }}{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mt-4">{{ form.name }}</h1>
    <p>{{ form.description }}</p>

    <!-- Download form link -->
    <h2 class="mt-4">Download Form</h2>
    <a href="{{ pdf_template.uploaded_pdf.url }}" class="btn btn-primary" download>Download Form (PDF/DOCX)</a>

    <!-- Form submission -->
    <h2 class="mt-4">Submit Signed Form</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="signed_form">Upload Signed Form (PDF/DOCX):</label>
            <input type="file" id="signed_form" name="signed_form" class="form-control-file" required>
        </div>
        
        <!-- Option for anonymous submission -->
        <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" id="is_anonymous" name="is_anonymous">
            <label class="form-check-label" for="is_anonymous">
                Submit anonymously
            </label>
        </div>

        <!-- Option for high importance submission -->
        <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" id="is_high_importance" name="is_high_importance">
            <label class="form-check-label" for="is_high_importance">
                Mark as high importance
            </label>
        </div>

        <button type="submit" class="btn btn-success mt-3">Submit</button>
    </form>
</div>
{% endblock %}
