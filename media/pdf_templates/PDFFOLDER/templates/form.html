<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form</title>
</head>
<body>
    <h1>Test Form</h1>
    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="period">Period:</label>
        <input type="text" id="period" name="period" required><br><br>

        <label for="sky_color">What color is the sky?</label>
        <input type="text" id="sky_color" name="sky_color" required><br><br>

        <label>Did you ride your bike today?</label><br>
        <input type="radio" id="yes" name="bike_ridden" value="Yes" required>
        <label for="yes">Yes</label><br>
        <input type="radio" id="no" name="bike_ridden" value="No" required>
        <label for="no">No</label><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
