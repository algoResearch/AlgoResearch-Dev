<!-- partials/personnel_nav.html -->
<div class="btn-group mb-4" role="group" aria-label="Personnel Form Navigation">
    <a href="{% url 'add_personnel_info' submission.id %}"
       class="btn {% if step == 'info' %}btn-primary{% else %}btn-outline-secondary{% endif %}">
        1. Info
    </a>
    {% if request.session.personnel_id %}
        <a href="{% url 'add_personnel_activities' submission.id %}"
           class="btn {% if step == 'activities' %}btn-primary{% else %}btn-outline-secondary{% endif %}">
            2. Activities
        </a>
        <a href="{% url 'add_personnel_training' submission.id %}"
           class="btn {% if step == 'training' %}btn-primary{% else %}btn-outline-secondary{% endif %}">
            3. Training
        </a>
    {% else %}
        <a class="btn btn-outline-secondary disabled">2. Activities</a>
        <a class="btn btn-outline-secondary disabled">3. Training</a>
    {% endif %}
</div>
