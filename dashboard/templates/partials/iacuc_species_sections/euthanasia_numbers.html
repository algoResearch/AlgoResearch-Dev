<form method="POST">
    {% csrf_token %}

    <table class="table table-bordered w-50">
        <thead class="table-light">
            <tr>
                <th>USDA Category</th>
                <th>Number of Animals</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>B</td>
                <td><input type="number" name="num_b" class="form-control" min="0"></td>
            </tr>
            <tr>
                <td>C</td>
                <td><input type="number" name="num_c" class="form-control" min="0"></td>
            </tr>
            <tr>
                <td>D</td>
                <td><input type="number" name="num_d" class="form-control" min="0"></td>
            </tr>
            <tr>
                <td>E</td>
                <td><input type="number" name="num_e" class="form-control" min="0"></td>
            </tr>
        </tbody>
    </table>

    <div class="mb-3">
        <label for="justification" class="form-label"><strong>Justify the number of animals being used:</strong></label>
        <textarea id="justification" name="justification" rows="4" class="form-control"></textarea>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
</form>
