<form method="POST">
    {% csrf_token %}
    {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}

    <div class="mb-3">
        {{ form.procedure_name.label_tag }}
        {{ form.procedure_name }}
    </div>
    <div class="mb-3">
        {{ form.description.label_tag }}
        {{ form.description }}
    </div>

    <button type="submit" name="save_procedure_{{ species|slugify }}" class="btn btn-success">Save</button>
</form>
