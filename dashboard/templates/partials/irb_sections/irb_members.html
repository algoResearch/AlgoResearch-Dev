<!-- Add Member Button -->
<button class="btn btn-outline-primary mb-3" data-bs-toggle="modal" data-bs-target="#addMemberModal">Add Member</button>

<!-- Members Table -->
<table class="table table-bordered">
  <thead>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Financial Interest</th>
      <th>Involved in Consent</th>
      <th>Email</th>
      <th>Phone</th>
    </tr>
  </thead>
  <tbody id="member-tbody">
    <tr class="text-muted text-center" id="no-members-row"><td colspan="6">No members added yet.</td></tr>
  </tbody>
</table>
<form method="POST" id="memberSaveForm">
    {% csrf_token %}
    <input type="hidden" name="members_json" id="membersJson">
    <input type="hidden" name="save_members_info" value="1">
    <button type="button" class="btn btn-success mt-3" onclick="submitMembers()">Save and Continue</button>
  </form>
  
<!-- Modal -->
<div class="modal fade" id="addMemberModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form id="memberForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Study Member</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3 position-relative">
          <label class="form-label">Search User</label>
          <input type="text" id="member-search" class="form-control" placeholder="Name, email, or username">
          <div id="member-results" class="list-group position-absolute w-100 z-3"></div>
        </div>
        <input type="hidden" id="selected-member-id">
        <div id="selected-member-display" class="text-muted mb-3 d-none"></div>

        <div class="mb-3">
          <label class="form-label">Role</label>
          <select id="member-role" class="form-select">
            <option value="PI">Principal Investigator</option>
            <option value="Co-Investigator">Co-Investigator</option>
            <option value="Research Coordinator">Research Coordinator</option>
            <option value="Other Staff">Other Study Staff</option>
            <option value="Grad Student">Graduate Student Investigator</option>
            <option value="Undergrad Student">Undergraduate Student Investigator</option>
            <option value="Study Physician">Study Physician</option>
            <option value="Study Nurse">Study Nurse</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Involved in Consent?</label><br>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="consent" value="yes" checked>
            <label class="form-check-label">Yes</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="consent" value="no">
            <label class="form-check-label">No</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Has Financial Interest?</label><br>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="interest" value="yes" checked>
            <label class="form-check-label">Yes</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="interest" value="no">
            <label class="form-check-label">No</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" type="submit">Add</button>
      </div>
    </form>
  </div>
</div>
<script>
    // 🔁 Initialize from backend
    let studyMembers = {{ member_entries_json|safe }};
    updateMemberTable();

    document.getElementById('member-search').addEventListener('input', function () {
        const query = this.value.trim();
        const resultsContainer = document.getElementById('member-results');

        if (!query) {
            resultsContainer.innerHTML = '';
            return;
        }

        fetch(`/search-users/?query=${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                resultsContainer.innerHTML = '';
                data.users.forEach(user => {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'list-group-item list-group-item-action';
                    item.textContent = `${user.first_name} ${user.last_name} (${user.username})`;
                    item.onclick = () => {
                        document.getElementById('selected-member-id').value = user.id;
                        document.getElementById('selected-member-display').textContent = `Selected: ${user.first_name} ${user.last_name}`;
                        document.getElementById('selected-member-display').classList.remove('d-none');
                        resultsContainer.innerHTML = '';
                        document.getElementById('member-search').value = '';
                    };
                    resultsContainer.appendChild(item);
                });
            });
    });

    document.getElementById('memberForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const id = document.getElementById('selected-member-id').value;
        if (!id) {
            alert("Please select a user.");
            return;
        }

        const name = document.getElementById('selected-member-display').textContent.replace('Selected: ', '');
        const role = document.getElementById('member-role').value;
        const involvedInConsent = document.querySelector('input[name="consent"]:checked').value === 'yes';
        const financialInterest = document.querySelector('input[name="interest"]:checked').value === 'yes';

        const member = {
            user_id: id,
            name: name,
            role: role,
            consent: involvedInConsent,
            interest: financialInterest,
            email: '',
            phone: ''
        };

        studyMembers.push(member);
        updateMemberTable();

        // Reset modal
        document.getElementById('memberForm').reset();
        document.getElementById('selected-member-id').value = '';
        document.getElementById('selected-member-display').classList.add('d-none');

        const modalEl = document.getElementById('addMemberModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();

        document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
        document.body.classList.remove('modal-open');
        document.body.style = '';
    });

    function updateMemberTable() {
        const tbody = document.getElementById('member-tbody');
        const noRow = document.getElementById('no-members-row');

        tbody.innerHTML = '';

        if (studyMembers.length === 0) {
            tbody.appendChild(noRow);
            return;
        }

        studyMembers.forEach(member => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${member.name}</td>
                <td>${member.role}</td>
                <td>${member.interest ? 'Yes' : 'No'}</td>
                <td>${member.consent ? 'Yes' : 'No'}</td>
                <td>${member.email || '-'}</td>
                <td>${member.phone || '-'}</td>
            `;
            tbody.appendChild(row);
        });
    }

    function submitMembers() {
        document.getElementById('membersJson').value = JSON.stringify(studyMembers);
        document.getElementById('memberSaveForm').submit();
    }
</script>
