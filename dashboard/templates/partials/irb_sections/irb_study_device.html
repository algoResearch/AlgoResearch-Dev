<h4>Study Device</h4>

<!-- Question 1: Device Table -->
<div class="mb-4">
    <button class="btn btn-outline-primary mb-3" data-bs-toggle="modal" data-bs-target="#addDeviceModal">Add Device</button>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Device Name</th>
                <th>Humanitarian Use</th>
            </tr>
        </thead>
        <tbody id="device-tbody">
            <tr class="text-muted text-center"><td colspan="2">No devices added yet.</td></tr>
        </tbody>
    </table>
</div>

<!-- Device Questions -->
<form method="post" id="device-form">
    {% csrf_token %}
    <input type="hidden" name="devices_json" id="devices-json">
    <input type="hidden" name="save_study_device_info" value="1">
    <!-- Device Exemption Status -->
    <div class="mb-3">
        <label class="form-label fw-bold">Device Exemptions applicable to this study?</label>
        {{ device_form.device_exemption_status }}
    </div>
    
    <div class="mb-3">
        <label class="form-label fw-bold">Will this study evaluate the safety or effectiveness of a device?</label>
        {{ device_form.evaluates_device_safety_effectiveness }}
    </div>    
    <button type="submit" class="btn btn-success">Save and Continue</button>
</form>

<!-- Add Device Modal -->
<div class="modal fade" id="addDeviceModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" onsubmit="event.preventDefault(); addDevice();">
            <div class="modal-header">
                <h5 class="modal-title">Add Device</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input class="form-control mb-2" name="device_name" placeholder="Device Name" required>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_humanitarian_use" id="is_humanitarian_use">
                    <label class="form-check-label" for="is_humanitarian_use">
                        Humanitarian Use
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Add Device</button>
            </div>
        </form>
    </div>
</div>

<script>
    const deviceEntries = {{ study_devices_json|safe }};
    renderDeviceTable();

    function addDevice() {
        const form = document.querySelector('#addDeviceModal form');
        const device_name = form.device_name.value;
        const is_humanitarian_use = form.is_humanitarian_use.checked;

        deviceEntries.push({ device_name, is_humanitarian_use });
        renderDeviceTable();
        bootstrap.Modal.getInstance(document.getElementById('addDeviceModal')).hide();
        cleanModalBackdrop();
        form.reset();
    }

    function renderDeviceTable() {
        const tbody = document.getElementById('device-tbody');
        tbody.innerHTML = deviceEntries.length
            ? deviceEntries.map(dev =>
                `<tr>
                    <td>${dev.device_name}</td>
                    <td>${dev.is_humanitarian_use ? 'Yes' : 'No'}</td>
                </tr>`
              ).join('')
            : '<tr class="text-muted text-center"><td colspan="2">No devices added yet.</td></tr>';
    }

    function cleanModalBackdrop() {
        document.body.classList.remove('modal-open');
        document.body.style = '';
        const backdrops = document.querySelectorAll('.modal-backdrop');
        backdrops.forEach(el => el.remove());
    }

    document.querySelector('#device-form').addEventListener('submit', function () {
        const hiddenInput = document.getElementById('devices-json');
        hiddenInput.value = JSON.stringify(deviceEntries);
    });
</script>
