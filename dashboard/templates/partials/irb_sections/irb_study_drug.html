<h4>Study Drug</h4>

<!-- Question 1: Drug Table -->
<div class="mb-4">
    <button class="btn btn-outline-primary mb-3" data-bs-toggle="modal" data-bs-target="#addDrugModal">Add Drug</button>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Generic Name</th>
                <th>Brand Name</th>
                <th>Drug Type</th>
            </tr>
        </thead>
        <tbody id="drug-tbody">
            <tr class="text-muted text-center"><td colspan="3">No drugs added yet.</td></tr>
        </tbody>
    </table>
</div>

<!-- Question 2: FDA IND -->
<form method="post" id="drug-form">
    {% csrf_token %}
    <input type="hidden" name="drugs_json" id="drugs-json">
    <input type="hidden" name="save_study_drug_info" value="1">
    <div class="mb-3">
        <label class="form-label fw-bold">
            Does this study evaluate the use of food, dietary supplements, an approved drug or biologic, or an unapproved drug or biologic, for a disease or condition under a FDA IND?
        </label>
        {{ drug_form.under_fda_ind }}
    </div>

    <div class="mb-3" id="ind-numbers-div" {% if not submission.under_fda_ind %}style="display:none;"{% endif %}>
        <label class="form-label">Please provide the IND Number(s):</label>
        {{ drug_form.ind_numbers }}
    </div>

    <button type="submit" class="btn btn-success">Save and Continue</button>
</form>

<!-- Add Drug Modal -->
<div class="modal fade" id="addDrugModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" onsubmit="event.preventDefault(); addDrug();">
            <div class="modal-header">
                <h5 class="modal-title">Add Drug</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input class="form-control mb-2" name="drug_generic" placeholder="Generic Name" required>
                <input class="form-control mb-2" name="drug_brand" placeholder="Brand Name" required>
                <select class="form-select mb-2" name="drug_type" onchange="toggleDrugOther(this)">
                    <option value="">-- Select Type --</option>
                    <option>Drug</option>
                    <option>Biologic</option>
                    <option>Food Product</option>
                    <option>Dietary Supplement</option>
                    <option>Other</option>
                </select>
                <input class="form-control mb-2 d-none" name="drug_other_type" placeholder="Specify other type">
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Add Drug</button>
            </div>
        </form>
    </div>
</div>

<script>
    const drugEntries = {{ study_drugs_json|safe }};
    renderDrugTable();
    function toggleDrugOther(select) {
        const input = select.form.querySelector('[name="drug_other_type"]');
        input.classList.toggle('d-none', select.value !== 'Other');
    }

    function addDrug() {
        const form = document.querySelector('#addDrugModal form');
        const generic = form.drug_generic.value;
        const brand = form.drug_brand.value;
        let type = form.drug_type.value;
        if (type === 'Other') {
            const otherVal = form.drug_other_type.value;
            if (otherVal.trim()) {
                type = `Other: ${otherVal}`;
            }
        }

        drugEntries.push({ generic, brand, type });
        renderDrugTable();
        bootstrap.Modal.getInstance(document.getElementById('addDrugModal')).hide();
        cleanModalBackdrop();  // ✅ This is the fix
        form.reset();
    }

    function cleanModalBackdrop() {
        document.body.classList.remove('modal-open');
        document.body.style = '';
        const backdrops = document.querySelectorAll('.modal-backdrop');
        backdrops.forEach(el => el.remove());
    }
    function renderDrugTable() {
        const tbody = document.getElementById('drug-tbody');
        tbody.innerHTML = drugEntries.length
            ? drugEntries.map(drug =>
                `<tr><td>${drug.generic}</td><td>${drug.brand}</td><td>${drug.type}</td></tr>`
              ).join('')
            : '<tr class="text-muted text-center"><td colspan="3">No drugs added yet.</td></tr>';
    }

    // IND conditional logic
    document.addEventListener('DOMContentLoaded', () => {
        const radios = document.querySelectorAll('[name="under_ind"]');
        const indField = document.getElementById('ind-numbers-div');
        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                indField.classList.toggle('d-none', radio.value !== 'yes');
            });
        });
    });
    document.querySelector('#drug-form').addEventListener('submit', function () {
        const hiddenInput = document.getElementById('drugs-json');
        hiddenInput.value = JSON.stringify(drugEntries);
    });
</script>
