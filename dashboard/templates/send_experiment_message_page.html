{% extends "base_dashboard.html" %}

{% block title %}Message Members{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <h2>Message Members of Experiment: {{ experiment.name }}</h2>

    <div class="card mt-4">
        <div class="card-header">
            <h3>Send Message to Experiment Members</h3>
        </div>
        <div class="card-body">
            <form method="POST" action="{% url 'send_experiment_message' org_id experiment.id %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-control" rows="4" required></textarea>
                </div>

                <div class="form-group mt-3">
                    <label>Select Recipients:</label>
                    <div class="checkbox-list">
                        <label>
                            <input type="checkbox" id="select_all"> Select All
                        </label>
                        {% for member in experiment_members %}
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" name="recipients" value="{{ member.id }}">
                            <label class="form-check-label">{{ member.username }}{% if member == experiment.owner %} (Creator){% endif %}</label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" class="btn btn-primary mt-3">Send Message</button>
            </form>
        </div>
    </div>
</div>

<script>
    // Select All functionality
    document.getElementById('select_all').addEventListener('click', function(event) {
        const checkboxes = document.querySelectorAll('.form-check-input');
        checkboxes.forEach((checkbox) => {
            checkbox.checked = event.target.checked;
        });
    });
</script>
{% endblock %}
