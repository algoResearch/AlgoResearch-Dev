{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>algoRhythm - Home</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .navbar {
            background-color: #000000;
            overflow: hidden;
            padding: 10px 20px;
        }
        .navbar a, .dropbtn {
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            display: inline-block;
        }
        .navbar a:hover, .dropdown:hover .dropbtn {
            background-color: #575757;
        }
        .dropdown {
            float: left;
            overflow: hidden;
        }
        .dropdown .dropbtn {
            font-size: 16px;
            border: none;
            outline: none;
            background-color: inherit;
            font-family: inherit;
            margin: 0;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-content a {
            float: none;
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .navbar .auth-buttons {
            float: right;
        }
        .navbar .auth-buttons a {
            background-color: #ff8000;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            margin-left: 10px;
        }
        .navbar .auth-buttons a:hover {
            background-color: #45a049;
        }
        .orange-space {
            height: 100vh;
            background-color: orange;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .orange-space h1 {
            font-size: 10em;
            color: black;
            margin: 0;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="dropdown">
            <button class="dropbtn">Products 
                <i class="fa fa-caret-down"></i>
            </button>
            <div class="dropdown-content">
                <a href="#">algoResearch</a>
                <a href="#">algoCare</a>
                <a href="#">algoMonitor</a>
            </div>
        </div>
        <div class="dropdown">
            <button class="dropbtn">Solutions 
                <i class="fa fa-caret-down"></i>
            </button>
            <div class="dropdown-content">
                <a href="#">Clinical Trials</a>
                <a href="#">Data Analytics</a>
                <a href="#">Health Monitoring</a>
            </div>
        </div>
        <a href="#">Customers</a>
        <a href="#">About Us</a>
        <div class="auth-buttons">
            <a href="{% url 'register' %}">Create Account</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="#">Request A Demo</a>
        </div>
    </div>
    <div class="orange-space">
        <h1>R & D</h1>
        <h1>Made</h1>
        <h1>Easy.</h1>
    </div>
</body>
</html>
