{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>algoRhythm - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .navbar {
            background-color: #000000;
            overflow: hidden;
            padding: 10px 20px;
        }
        .navbar a, .dropbtn {
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            display: inline-block;
        }
        .navbar a:hover, .dropdown:hover .dropbtn {
            background-color: #575757;
        }
        .dropdown {
            float: left;
            overflow: hidden;
        }
        .dropdown .dropbtn {
            font-size: 16px;
            border: none;
            outline: none;
            background-color: inherit;
            font-family: inherit;
            margin: 0;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-content a {
            float: none;
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .navbar .auth-buttons {
            float: right;
        }
        .navbar .auth-buttons a {
            background-color: #ff8000;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            margin-left: 10px;
        }
        .navbar .auth-buttons a:hover {
            background-color: #45a049;
        }
        .orange-space {
            height: 100vh;
            background-color: orange;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .orange-space h1 {
            font-size: 10em;
            color: black;
            margin: 0;
            line-height: 1.2;
        }
        .request-demo {
            background-color: white;
            padding: 30px;
            margin: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        .request-demo h2 {
            color: #ff8000;
            text-align: center;
            margin-bottom: 20px;
        }
        .request-demo form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .request-demo label {
            display: block;
            width: 100%;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .request-demo input, .request-demo textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .request-demo button {
            background-color: #ff8000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .request-demo button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="dropdown">
            <button class="dropbtn">Products 
                <i class="fa fa-caret-down"></i>
            </button>
            <div class="dropdown-content">
                <a href="#">algoResearch</a>
                <a href="#">algoCare</a>
                <a href="#">algoMonitor</a>
            </div>
        </div>
        <div class="dropdown">
            <button class="dropbtn">Solutions 
                <i class="fa fa-caret-down"></i>
            </button>
            <div class="dropdown-content">
                <a href="#">Clinical Trials</a>
                <a href="#">Data Analytics</a>
                <a href="#">Health Monitoring</a>
            </div>
        </div>
        <a href="#">Customers</a>
        <a href="#">About Us</a>
        <div class="auth-buttons">
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'admin_login' %}">Admin</a>
            <a href="{% url 'it_admin_login' %}">IT Admin</a> <!-- New IT Admin Login Link -->
            <a href="#request-demo">Request A Demo</a>
        </div>
    </div>

    <!-- Main Section -->
    <div class="orange-space">
        <h1>R & D</h1>
        <h1>Made</h1>
        <h1>Easy.</h1>
    </div>

    <!-- Request a Demo Form -->
    <div class="request-demo" id="request-demo">
        <h2>Request a Demo</h2>
        <a href="{% url 'request_demo' %}">Request A Demo</a>
            {% csrf_token %}
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="company">Company Name:</label>
            <input type="text" id="company" name="company" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Submit Request</button>
        </form>
    </div>
</body>
</html>
