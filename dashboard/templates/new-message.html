{% extends "base_dashboard.html" %}
{% load static %} <!-- Load the static tag library -->

{% block title %}New Message{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center">New Message</h2>
    <form id="messageForm" class="form-group" method="POST" action="{% url 'send_new_message' org_id %}">
        <div class="mb-3 position-relative">
            <label for="receiver_usernames" class="form-label">To:</label>
            <input type="text" class="form-control" id="receiver_usernames" name="receiver_usernames" placeholder="Start typing a username..." autocomplete="off" required>
            <div id="userSuggestions" class="list-group position-absolute w-100" style="z-index: 1000;"></div> <!-- Suggestions box -->
        </div>
        
        <div class="mb-3">
            <label for="content" class="form-label">Message:</label>
            <textarea class="form-control" id="content" name="content" placeholder="Type your message here..." rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const receiverInput = document.getElementById('receiver_usernames');
        const suggestionsBox = document.getElementById('userSuggestions');

        // Define the default profile picture URL
        const defaultProfilePic = "{% static 'img/default-profile.jpg' %}";

        // Handle user search input
        receiverInput.addEventListener('input', function() {
            const query = this.value;

            if (query.length > 0) {
                fetch(`{% url 'search_users' %}?query=${encodeURIComponent(query)}`, {
                    method: 'GET',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    suggestionsBox.innerHTML = '';  // Clear previous suggestions

                    if (data.users.length > 0) {
                        data.users.forEach(user => {
                            const suggestionItem = document.createElement('a');
                            suggestionItem.href = '#';
                            suggestionItem.className = 'list-group-item list-group-item-action d-flex align-items-center';
                            suggestionItem.onclick = function(e) {
                                e.preventDefault();
                                receiverInput.value = user.username;  // Set selected user
                                suggestionsBox.innerHTML = '';  // Clear suggestions
                            };

                            // Create profile picture element
                            const profilePic = document.createElement('img');
                            profilePic.src = user.profile_picture || defaultProfilePic;
                            profilePic.className = 'rounded-circle me-2';
                            profilePic.style.width = '30px';
                            profilePic.style.height = '30px';
                            profilePic.style.objectFit = 'cover';

                            // Append profile picture and username to suggestion item
                            suggestionItem.appendChild(profilePic);
                            suggestionItem.appendChild(document.createTextNode(user.username));

                            suggestionsBox.appendChild(suggestionItem);
                        });
                    } else {
                        const noResultsItem = document.createElement('a');
                        noResultsItem.className = 'list-group-item list-group-item-action disabled';
                        noResultsItem.textContent = 'No users found';
                        suggestionsBox.appendChild(noResultsItem);
                    }
                })
                .catch(error => console.error('Error fetching users:', error));
            } else {
                // Clear suggestions if input is empty
                suggestionsBox.innerHTML = '';
            }
        });

        // Handle form submission
        document.getElementById('messageForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission
            const form = event.target;
            const formData = new FormData(form);
            const jsonData = {};
            formData.forEach((value, key) => jsonData[key] = value);

            const receiverUsernames = jsonData.receiver_usernames.split(',').map(name => name.trim());

            fetch("{% url 'send_new_message' org_id %}",  {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    receiver_usernames: receiverUsernames,
                    content: jsonData.content
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'Message sent') {
                    const conversationUrl = `{% url 'conversation' org_id=0 conversation_id=0 %}`
                        .replace('0', "{{ org_id }}")
                        .replace('0', data.conversation_id); 
                    window.location.href = conversationUrl;  // Redirect to the conversation page
                } else {
                    alert('Error sending messages: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('There was an error sending the messages.');
            });
        });
    });
</script>

<style>
    .container {
        max-width: 700px;
        background: #fff;
        padding: 20px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
    }

    #userSuggestions {
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000; /* Ensure it appears above other elements */
    }

    .list-group-item.active {
        background-color: #4CAF50;
        color: white;
        border-color: #4CAF50;
    }

    .btn-primary {
        background-color: #4CAF50;
        border-color: #4CAF50;
    }

    .btn-primary:hover {
        background-color: #45a049;
        border-color: #45a049;
    }
</style>
{% endblock %}
