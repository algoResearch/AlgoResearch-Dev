{% extends base_template %}
{% load static %} <!-- Load the static tag library -->
{% block title %}New Message{% endblock %}
{% block content %}

<div class="container mt-4">
    <h2 class="text-center">New Message</h2>
    <form id="messageForm" class="form-group" method="POST" enctype="multipart/form-data" action="{% if '/admin/' in request.path %}{% url 'admin_send_new_message' org_id %}{% else %}{% url 'send_new_message' org_id %}{% endif %}"
        {% csrf_token %}
        <div class="mb-3 position-relative">
            <label for="receiver_usernames" class="form-label">To:</label>
            <input type="text" class="form-control" id="receiver_usernames" name="receiver_usernames" placeholder="Start typing a username..." autocomplete="off">
            <div id="selectedUsers" class="list-group mt-2"></div> 
            <div id="userSuggestions" class="list-group position-absolute w-100" style="z-index: 1000;"></div> <!-- Suggestions box -->
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Message:</label>
            <div class="input-group">
                <label for="attachment" class="attachment-label m-0">
                    <i class="fas fa-paperclip icon-size"></i>
                    <input type="file" name="attachment" id="attachment" class="d-none">
                </label>
                <textarea class="form-control auto-expand" id="content" name="content" placeholder="Type your message here..." rows="1"></textarea>
                <button type="submit" class="btn btn-link">
                    <i class="fa fa-arrow-right icon-size"></i>
                </button>
            </div>
        </div>        
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const receiverInput = document.getElementById('receiver_usernames');
        const suggestionsBox = document.getElementById('userSuggestions');
        const selectedUsersBox = document.getElementById('selectedUsers');
        let selectedUsers = [];  // Store selected users
        // CSRF Token retrieval function
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const csrfToken = getCookie('csrftoken'); // Retrieve CSRF token from cookies

        receiverInput.addEventListener('input', function() {
            const query = this.value;

            if (query.length > 0) {
                fetch(`{% url 'search_users' %}?query=${encodeURIComponent(query)}`, {
                    method: 'GET',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    suggestionsBox.innerHTML = '';  // Clear previous suggestions
                    if (data.users.length > 0) {
                        data.users.forEach(user => {
                            const suggestionItem = document.createElement('a');
                            suggestionItem.href = '#';
                            suggestionItem.className = 'list-group-item list-group-item-action d-flex align-items-center';
                            suggestionItem.onclick = function(e) {
                                e.preventDefault();

                                if (!selectedUsers.includes(user.username)) {
                                    selectedUsers.push(user.username);  // Add the selected user
                                    receiverInput.value = '';  // Clear the input field
                                    suggestionsBox.innerHTML = '';  // Clear suggestions

                                    // Create a visual representation of the selected user
                                    const userItem = document.createElement('span');
                                    userItem.className = 'experiment-badge bg-secondary m-1';
                                    userItem.innerText = user.username;

                                    // Add a remove button to remove selected users
                                    const removeButton = document.createElement('span');
                                    removeButton.className = 'ms-1 text-danger';
                                    removeButton.innerHTML = '&times;';
                                    removeButton.style.cursor = 'pointer';
                                    removeButton.onclick = function() {
                                        selectedUsers = selectedUsers.filter(u => u !== user.username);
                                        selectedUsersBox.removeChild(userItem);  // Remove the user from the UI
                                    };

                                    userItem.appendChild(removeButton);
                                    selectedUsersBox.appendChild(userItem);  // Append the user to the selected users box
                                }
                            };

                            // Create profile picture element
                            const profilePic = document.createElement('img');
                            profilePic.src = user.profile_picture || "{% static 'img/default-profile.jpg' %}";
                            profilePic.className = 'rounded-circle me-2';
                            profilePic.style.width = '30px';
                            profilePic.style.height = '30px';

                            // Append profile picture and username to suggestion item
                            suggestionItem.appendChild(profilePic);
                            suggestionItem.appendChild(document.createTextNode(user.username));

                            suggestionsBox.appendChild(suggestionItem);
                        });
                    } else {
                        const noResultsItem = document.createElement('a');
                        noResultsItem.className = 'list-group-item list-group-item-action disabled';
                        noResultsItem.textContent = 'No users found';
                        suggestionsBox.appendChild(noResultsItem);
                    }
                })
                .catch(error => console.error('Error fetching users:', error));
            } else {
                suggestionsBox.innerHTML = '';  // Clear suggestions if input is empty
            }
        });
        // Handle form submission
        document.getElementById('messageForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission

            const form = event.target;
            const formData = new FormData(form); // Use FormData for file support

            // Ensure at least one user is selected
            if (selectedUsers.length === 0) {
                alert("Please select at least one user.");
                return;
            }

            const content = formData.get("content");
            const attachment = formData.get("attachment");

            if (!content.trim() && (!attachment || attachment.size === 0)) {
                alert("Please enter a message or attach a file.");
                return;
            }

            // Set selected usernames as a comma-separated string
            formData.set("receiver_usernames", selectedUsers.join(","));

            fetch(form.action, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'Message sent') {
                    window.location.href = data.redirect_url; // Redirect after success
                } else {
                    alert('Error sending message: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('There was an error sending the message.');
            });
        });
    })
</script>

<style>
    .container {
        max-width: 700px;
        background: #fff;
        padding: 20px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
    }

    #userSuggestions {
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000; /* Ensure it appears above other elements */
    }

    .list-group-item.active {
        background-color: #4CAF50;
        color: white;
        border-color: #4CAF50;
    }

    .btn-primary {
        background-color: #4CAF50;
        border-color: #4CAF50;
    }

    .btn-primary:hover {
        background-color: #45a049;
        border-color: #45a049;
    }
    .attachment-label {
        display: flex;
        align-items: center;
        cursor: pointer;
        color: #007bff;
        margin-right: 10px;
        margin-top: -5px;
    }

    .attachment-label i {
        font-size: 1.8em;
        vertical-align: middle;
        line-height: 1;
        margin-right: 6px;
    }

    .btn-link i {
        font-size: 1.8em;
        color: #007bff;
    }

    .btn-link:hover i {
        color: #0056b3;
    }

    .auto-expand {
        resize: none;
        overflow-y: auto;
        font-size: 1rem;
        line-height: 1.5;
        border-radius: 25px;
        padding: 10px 15px;
        border: 1px solid #ccc;
        max-height: 200px;
        min-height: 48px;
        transition: border-color 0.3s ease;
    }

    .auto-expand:focus {
        border-color: #007bff;
        outline: none;
    }

    .input-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }
</style>
{% endblock %}
