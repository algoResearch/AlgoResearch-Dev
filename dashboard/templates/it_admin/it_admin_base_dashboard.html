{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover">
    <title>{% block title %}Org IT Admin Dashboard{% endblock %}</title>
    <!-- Fonts and Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link id="pagestyle" href="{% static 'js/assets/css/soft-ui-dashboard.css' %}" rel="stylesheet">
    <style>
        /* Sidebar Styling */
        .sidenav {
            height: 100vh;
            width: 60px;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
            background-color: {{ user.organization.sidebar_color|default:'rgb(17, 86, 0)' }};
            transition: width 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .sidenav.expanded {
            width: 250px;
        }
        .sidenav .sidenav-header {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            background-color: {{ user.organization.sidebar_color|default:'rgb(17, 86, 0)' }};
            color: white;
        }
        .sidenav .nav-item {
            width: 100%;
        }
        .sidenav .nav-link {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 15px;
            color: white;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }
        .sidenav .nav-link .icon-container {
            width: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sidenav .nav-link .nav-link-text {
            display: none;
            margin-left: 10px;
            font-size: 1rem;
        }
        .sidenav.expanded .nav-link .nav-link-text {
            display: inline;
        }
        .sidenav .nav-link:hover {
            background-color: {{ user.organization.hover_color|default:'#e1cd10' }};
        }
        .sidenav .nav-link.active {
            background-color: #007bff;
        }

        /* Main Content Styling */
        .main-content {
            margin-left: 60px;
            padding: 20px;
            transition: margin-left 0.3s;
        }
        .main-content.expanded {
            margin-left: 250px;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidenav" id="sidenav-main">
        <!-- Sidebar Header -->
        <div class="sidenav-header">
            <img src="{% static 'img/logo-small.png' %}" alt="Org Logo" style="max-height: 40px;">
        </div>
        <!-- Navigation Links -->
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'org_it_admin_dashboard' %}active{% endif %}" href="{% url 'org_it_admin_dashboard' %}">
                    <div class="icon-container"><i class="fas fa-home"></i></div>
                    <span class="nav-link-text">Dashboard</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">
                    <div class="icon-container"><i class="fas fa-comments"></i></div>
                    <span class="nav-link-text">Messaging</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'org_it_admin_manage_users' %}active{% endif %}" href="{% url 'org_it_admin_manage_users' %}">
                    <div class="icon-container"><i class="fas fa-users"></i></div>
                    <span class="nav-link-text">Users</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <div class="icon-container"><i class="fas fa-shield-alt"></i></div>
                    <span class="nav-link-text">Security</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <div class="icon-container"><i class="fas fa-desktop"></i></div>
                    <span class="nav-link-text">Devices</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <div class="icon-container"><i class="fas fa-database"></i></div>
                    <span class="nav-link-text">Data</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'org_it_admin_settings' %}active{% endif %}" href="{% url 'org_it_admin_settings' %}">
                    <div class="icon-container"><i class="fas fa-cog"></i></div>
                    <span class="nav-link-text">Settings</span>
                </a>
            </li>
            <li class="nav-item">
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="nav-link btn btn-link text-white">
                        <div class="icon-container"><i class="fas fa-sign-out-alt"></i></div>
                        <span class="nav-link-text">Logout</span>
                    </button>
                </form>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}
        <h1>Welcome to the Org IT Admin Dashboard</h1>
        {% endblock %}
    </main>

    <!-- JavaScript for Sidebar Toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sidenav = document.getElementById('sidenav-main');
            const mainContent = document.querySelector('.main-content');

            // Sidebar toggle logic
            sidenav.addEventListener('click', function () {
                sidenav.classList.toggle('expanded');
                mainContent.classList.toggle('expanded');
            });
        });
    </script>
</body>
</html>
