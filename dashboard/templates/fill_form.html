{% extends "base_dashboard.html" %}
{% load custom_filters %}
{% block title %}Fill Out Form{% endblock %}
{% block page_title %}Fill Out Form{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mt-4">Fill Out Form</h1>
    <p>Please fill out the following form:</p>

    <form method="post">
        {% csrf_token %}
        
        <!-- Example fields -->
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="date_of_birth">Date of Birth:</label>
            <input type="date" id="date_of_birth" name="date_of_birth" class="form-control" required>
        </div>
        
        <!-- Option to select whether to generate PDF or DOCX -->
        <div class="form-group">
            <label for="document_type">Choose Output Format:</label>
            <select id="document_type" name="document_type" class="form-control">
                <option value="pdf">PDF</option>
                <option value="docx">DOCX</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Generate Document</button>
    </form>
</div>
{% endblock %}
