{% extends "base/base_dashboard.html" %} {% load static %} {% block title %}AI
Assistant{% endblock %} {% block content %}
<div class="container-fluid py-4">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header pb-0">
          <h5>AI Assistant powered by Google Gemini</h5>
          <p class="text-sm mb-0">
            Ask questions, get summaries, analyze sentiment, and more!
          </p>
        </div>
        <div class="card-body">
          <!-- Chat Interface -->
          <div
            class="chat-container mb-4"
            style="
              height: 400px;
              overflow-y: auto;
              border: 1px solid #ddd;
              border-radius: 8px;
              padding: 20px;
            "
          >
            <div id="chatMessages"></div>
          </div>

          <!-- Input Area -->
          <div class="input-group">
            <textarea
              id="userPrompt"
              class="form-control"
              placeholder="Type your message here..."
              rows="3"
            ></textarea>
            <button class="btn btn-primary" onclick="sendMessage()">
              <i class="fas fa-paper-plane"></i> Send
            </button>
          </div>

          <!-- Quick Actions -->
          <div class="mt-4">
            <h6>Quick Actions:</h6>
            <div class="btn-group" role="group">
              <button
                class="btn btn-sm btn-outline-primary"
                onclick="quickAction('summarize')"
              >
                Summarize Text
              </button>
              <button
                class="btn btn-sm btn-outline-primary"
                onclick="quickAction('sentiment')"
              >
                Analyze Sentiment
              </button>
              <button
                class="btn btn-sm btn-outline-primary"
                onclick="quickAction('keywords')"
              >
                Extract Keywords
              </button>
              <button
                class="btn btn-sm btn-outline-primary"
                onclick="quickAction('research')"
              >
                Research Suggestions
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .message {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 8px;
  }
  .user-message {
    background-color: #e3f2fd;
    text-align: right;
  }
  .ai-message {
    background-color: #f5f5f5;
  }
  .message-label {
    font-weight: bold;
    font-size: 0.85em;
    margin-bottom: 5px;
  }
</style>

<script>
  function addMessage(content, isUser = false) {
    const messagesDiv = document.getElementById("chatMessages");
    const messageDiv = document.createElement("div");
    messageDiv.className = `message ${isUser ? "user-message" : "ai-message"}`;

    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent = isUser ? "You" : "AI Assistant";

    const text = document.createElement("div");
    text.textContent = content;

    messageDiv.appendChild(label);
    messageDiv.appendChild(text);
    messagesDiv.appendChild(messageDiv);

    // Scroll to bottom
    messagesDiv.parentElement.scrollTop =
      messagesDiv.parentElement.scrollHeight;
  }

  async function sendMessage() {
    const promptInput = document.getElementById("userPrompt");
    const prompt = promptInput.value.trim();

    if (!prompt) return;

    // Add user message
    addMessage(prompt, true);
    promptInput.value = "";

    // Show loading
    const loadingId = "loading-" + Date.now();
    addMessage("Thinking...", false);

    try {
      const response = await fetch('{% url "ai:assistant" %}', {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({ prompt: prompt }),
      });

      const data = await response.json();

      // Remove loading message
      const messages = document.getElementById("chatMessages");
      messages.removeChild(messages.lastChild);

      if (data.response) {
        addMessage(data.response, false);
      } else {
        addMessage("Error: " + (data.error || "Unknown error"), false);
      }
    } catch (error) {
      console.error("Error:", error);
      addMessage("Error: Failed to get response", false);
    }
  }

  function quickAction(action) {
    let prompt = "";

    switch (action) {
      case "summarize":
        prompt = "Please paste the text you want me to summarize.";
        break;
      case "sentiment":
        prompt = "Please paste the text you want me to analyze for sentiment.";
        break;
      case "keywords":
        prompt =
          "Please paste the text from which you want me to extract keywords.";
        break;
      case "research":
        prompt = "What research area would you like suggestions for?";
        break;
    }

    document.getElementById("userPrompt").value = prompt;
    document.getElementById("userPrompt").focus();
  }

  // Allow Enter to send (Shift+Enter for new line)
  document
    .getElementById("userPrompt")
    .addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
</script>
{% endblock %}
