{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <!-- Fonts and icons -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
    <link href="{% static 'js/assets/css/nucleo-icons.css' %}" rel="stylesheet" />
    <link href="{% static 'js/assets/css/nucleo-svg.css' %}" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Correct paths for static files -->
    <link href="{% static 'css/dashboard-free.css' %}" rel="stylesheet">
    <script src="{% static 'js/dashboard-free.js' %}"></script>
    <script src="{% static 'js/chart.umd.js' %}"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <link href="{% static 'js/assets/css/nucleo-svg.css' %}" rel="stylesheet" />
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'js/assets/css/nucleo-icons.css' %}" rel="stylesheet">
    <!-- CSS Files -->
    <link id="pagestyle" href="{% static 'js/assets/css/soft-ui-dashboard.css' %}" rel="stylesheet" />

    <style>
        /* General reset and height settings */
        html, body {
            overflow: hidden;
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Sidebar (sidenav) styles */
        .sidenav-footer {
            height: 100vh;
            width: 50px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 25px;
            margin: 0;
            border-right: 2px solid greenyellow;
            z-index: 1000;
        }
        /* Remove tooltip/label from icons in base_conversation */
        .sidenav-footer .navbar-nav .nav-link-text {
            display: none !important;
        }

        /* Main content styles */
        .main-content {
            height: 100vh;
            margin-left: 60px;
            padding: 0px;
            overflow-y: auto;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            border: 2px solid yellow;
            left: -220px;
            width: calc(100% + 220px);
        }

        /* Adjust the conversation list to push it directly next to the sliver */
        .col-md-4 {
            width: 30%; /* Or adjust to your desired width */
            margin-left: 50px;
            padding-left: 0;
            background-color: #ffffff; /* Corrected background */
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 2px solid blue;
            box-sizing: border-box;
        }

        /* Adjust the main conversation box */
        .col-md-8 {
            width: 70%;
            padding: 0;
            margin: 0;
            height: 100vh;
            flex-grow: 1;
        }

        /* General container for the entire conversation page */
        .container-fluid {
            padding-left: 0 !important;
            padding-right: 0 !important;
            padding-top: 0 !important;
        }

        /* Conversation content (messages area) */
        .conversation-box {
            flex-grow: 1;
            width: 70%;
            margin-right: 0;
            padding: 0;
            max-height: 100vh;
            overflow-y: auto;
        }

        /* Sidebar for the icons (sliver) */
        .sidebar-box {
            width: 50px;
            margin-left: 0;
            padding-left: 0;
        }

        /* Responsive avatar styles */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .username {
            margin-left: 10px;
            font-weight: bold;
        }

        /* Navbar collapse to stack items vertically */
        .navbar-collapse {
            display: flex;
            flex-direction: column;
        }

        /* Center nav icons in the sidenav */
        .navbar-nav .nav-item {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        /* Prevent purple icon color in the conversation sidebar */
        #sidenav-main .navbar-nav .nav-link .icon:active, 
        #sidenav-main .navbar-nav .nav-link .icon:focus, 
        #sidenav-main .navbar-nav .nav-link .icon:hover {
            box-shadow: none
            color: inherit !important;
            background-color: transparent !important;
            outline: none; 
        }

        /* Icon size and styling */
        .navbar-nav .nav-link .icon {
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8em;
        }

        /* Adjust avatar to align with icons */
        .sidenav-header .avatar {
            margin-left: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
    </style>
</head>
<body class="g-sidenav-show bg-gray-100">
    <!-- Sidenav (Sidebar) -->
    <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-0 border-radius-xl fixed-start" id="sidenav-main">
        <!-- Adjusted Sidenav header for better alignment -->
        <div class="sidenav-footer" style="padding-bottom: 0; margin-bottom: 10px;">
            <i class="fas fa-times p-3 cursor-pointer text-secondary opacity-5 position-absolute end-0 top-0 d-xl-none" aria-hidden="true" id="iconSidenav"></i>
            <a class="navbar-brand m-0" href="javascript:void(0)">
                {% if user.profile_picture %}
                    <img src="{{ user.profile_picture.url }}" class="avatar avatar-sm border-radius-lg" alt="Profile Picture">
                {% else %}
                    <img src="{% static 'img/default-profile.jpg' %}" class="avatar avatar-sm border-radius-lg" alt="Default Profile Picture">
                {% endif %}
            </a>
        </div>
        <hr class="horizontal dark mt-0 mb-1">
        
        <!-- Sidenav Footer with All Features -->
        <div class="sidenav-footer">
            <ul class="navbar-nav">
                <!-- Dashboard Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="ni ni-shop text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                    </a>
                </li>

                <!-- Messages Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'messages' %}active{% endif %}" href="{% url 'messages' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="ni ni-chat-round text-dark"></i>
                        </div>
                    </a>                    
                </li>

                <!-- All Experiments Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'all_experiments' %}active{% endif %}" href="{% url 'all_experiments' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="ni ni-collection text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                    </a>
                </li>

                <!-- Create New Experiment Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == '' %}active{% endif %}" href="{% url 'experiment_basic_info' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="ni ni-ruler-pencil text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                    </a>
                </li>

                <!-- Colony Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'colony' %}active{% endif %}" href="{% url 'colony' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="fas fa-paw text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                    </a>
                </li>

                <!-- Studies Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'Studies' %}active{% endif %}" href="{% url 'Studies' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="ni ni-archive-2 text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                    </a>
                </li>

                <!-- Import Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'import' %}active{% endif %}" href="{% url 'import_data' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="fas fa-arrow-left text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                    </a>
                </li>

                <!-- Export Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'export' %}active{% endif %}" href="{% url 'export_data' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="fas fa-arrow-right text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                    </a>
                </li>

                <!-- Inbox Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'inbox' %}active{% endif %}" href="{% url 'inbox' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="fas fa-envelope text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                        <span id="unread-notifications-count" class="badge bg-danger ms-2">{{ unread_notifications_count }}</span>
                    </a>
                </li>

                <!-- Forms Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'forms' %}active{% endif %}" href="{% url 'forms' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="ni ni-paper-diploma text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                    </a>            
                </li>    

                <!-- Profile Link -->
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'profile' org_id=user.organization.id %}">
                        <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                            <i class="ni ni-single-02 text-dark"></i>
                        </div>
                        <span class="nav-link-text ms-1"></span>
                    </a>
                </li>

                <!-- Logout Link -->
                <li class="nav-item">
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-link btn btn-link">
                            <div class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center" style="margin-left: -15px;">
                                <i class="ni ni-user-run text-dark"></i>
                            </div>
                            <span class="nav-link-text ms-1"></span>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
        <!-- Navbar -->
        <nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl" id="navbarBlur" navbar-scroll="true">
            <div class="container-fluid py-1 px-3">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0 me-sm-6 me-5">
                        <li class="breadcrumb-item text-sm text-dark active" aria-current="page">
                            {% block breadcrumb_title %}{% endblock %}
                        </li>
                    </ol>
                    <h6 class="font-weight-bolder mb-0">{% block page_title %}{% endblock %}</h6>
                </nav>
                <div class="collapse navbar-collapse mt-sm-0 mt-2 me-md-0 me-sm-4" id="navbar">
                    <div class="ms-md-auto pe-md-3 d-flex align-items-center">
                        <div class="input-group">
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <!-- End Navbar -->

        <div class="container-fluid py-4">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Core JS Files -->
    <script src="{% static 'js/assets/js/core/popper.min.js' %}"></script>
    <script src="{% static 'js/assets/js/core/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/assets/js/plugins/perfect-scrollbar.min.js' %}"></script>
    <script src="{% static 'js/assets/js/plugins/smooth-scrollbar.min.js' %}"></script>
    <script src="{% static 'js/assets/js/plugins/chartjs.min.js' %}"></script>

    <!-- Additional scripts -->
    <script src="{% static 'js/assets/js/soft-ui-dashboard.min.js' %}"></script>

    <!-- Scrollbar script -->
    <script>
        var win = navigator.platform.indexOf('Win') > -1;
        if (win && document.querySelector('#sidenav-scrollbar')) {
            var options = {
                damping: '0.5'
            }
            Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
        }
        const orgId = "{{ org_id }}"; 
        fetch("{% url 'unread_messages_count' %}")
            .then(response => response.json())
            .then(data => {
                const count = data.unread_count || 0;
                document.getElementById('unread-messages-count').innerText = count;
            })
            .catch(error => {
                console.error('Error fetching unread messages count:', error);
                document.getElementById('unread-messages-count').innerText = '0';
            });
    </script>
</body>

</html>
