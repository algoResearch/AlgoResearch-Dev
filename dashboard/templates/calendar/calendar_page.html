{% extends "base/base_dashboard.html" %}
{% load static %}

{% block title %}Calendar{% endblock %}
{% block breadcrumb_title %}Calendar{% endblock %}
{% block page_title %}Calendar{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div id="calendar"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        selectable: true,
        editable: true,
        events: '/api/events/', // Fetch events from your Django API
        eventColor: '#378006',
        select: function(info) {
            var title = prompt('Enter Event Title:');
            if (title) {
                calendar.addEvent({
                    title: title,
                    start: info.startStr,
                    end: info.endStr
                });
                // Optional: Save event to the server
                fetch('{% url "api_add_event" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ title: title, start: info.startStr, end: info.endStr })
                });
            }
            calendar.unselect();
        },
        eventClick: function(info) {
            if (confirm('Are you sure you want to delete this event?')) {
                info.event.remove();
                // Optional: Delete event from the server
                fetch(`/api/delete-event/${info.event.id}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });
            }
        }
    });
    calendar.render();
});
</script>
{% endblock %}
