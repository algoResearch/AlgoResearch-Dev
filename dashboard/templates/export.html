{% extends "base_dashboard.html" %}
{% load static %}

{% block title %}Export Experiment Data{% endblock %}
{% block breadcrumb_title %}Export Data{% endblock %}
{% block page_title %}Export Experiment Data{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="text-center">Export Experiment Data</h2>
                    <form method="POST" action="{% url 'export_data' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="experiment">Select Experiment:</label>
                            <select id="experiment" name="experiment" class="form-control" required>
                                {% for experiment in experiments %}
                                    <option value="{{ experiment.id }}">{{ experiment.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success mt-4 w-100">Export to CSV</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
