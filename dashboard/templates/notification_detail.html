{% extends base_template %}
{% load static %}
{% block content %}
<<div class="notification-detail">
    <h3>{{ notification.title|default:"Notification" }}</h3>
    <p><strong>From:</strong> {{ notification.sender_name }}</p>
    <p><strong>Date:</strong> {{ notification.timestamp|date:"M d, Y h:i A" }}</p>
    <p>{{ notification.message }}</p>
</div>
<script>
function respondToInvitation(invitationId, response) {
    fetch(`/${org_id}/respond-to-event-invitation/${invitationId}/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({ response: response })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status.includes('Invitation')) {
            alert(`Invitation ${response} successfully`);
            location.reload();
        } else {
            alert('Error responding to invitation');
        }
    });
}
</script>
{% endblock %}
