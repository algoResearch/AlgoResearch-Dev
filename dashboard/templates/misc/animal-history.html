{% extends "base/base.html" %}
{% block title %}Animal History{% endblock %}
{% block content %}
<div class="animal-history-content">
    <h2>History for Animal RFID: {{ rfid }}</h2>
    <div class="chart-container">
        <canvas id="historyChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('historyChart').getContext('2d');
        const timestamps = {{ timestamps | tojson }};
        const weights = {{ weights | tojson }};
        const tumorSizes = {{ tumor_sizes | tojson }};

        const data = {
            labels: timestamps,
            datasets: [
                {
                    label: 'Weight',
                    data: weights,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    fill: false,
                    yAxisID: 'y'
                },
                {
                    label: 'Tumor Size',
                    data: tumorSizes,
                    borderColor: 'rgba(255, 99, 132, 1)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    fill: false,
                    yAxisID: 'y1'
                }
            ]
        };

        const config = {
            type: 'line',
            data: data,
            options: {
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',

                        // grid line settings
                        grid: {
                            drawOnChartArea: false, // only want the grid lines for one axis to show up
                        },
                    },
                }
            }
        };

        new Chart(ctx, config);
    </script>
</div>
{% endblock %}
