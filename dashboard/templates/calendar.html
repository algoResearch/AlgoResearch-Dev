{% extends base_template %}
{% load static %}
{% block title %}Calendar{% endblock %}
{% block breadcrumb_title %}Calendar{% endblock %}
{% block page_title %}Calendar{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <button id="prevButton" class="btn btn-secondary"><i class="fas fa-arrow-left"></i></button>
                <h4 id="calendarTitle" class="text-center mb-0">Calendar</h4>
                <button id="nextButton" class="btn btn-secondary"><i class="fas fa-arrow-right"></i></button>
                <div>
                    <button id="toggleMonthlyView" class="btn btn-secondary">Monthly View</button>
                    <button id="toggleWeeklyView" class="btn btn-secondary">Weekly View</button>
                </div>
                <button id="addEventButton" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add Event
                </button>
            </div>
            <div id="calendar" class="calendar-container" data-org-id="{{ org_id }}"></div>
        </div>
    </div>
</div>

<!-- Event Modal -->
<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="eventModalLabel">Add New Event</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="eventForm">
                    <div class="form-group">
                        <label for="eventTitle">Title</label>
                        <input type="text" class="form-control" id="eventTitle" required>
                    </div>
                    <div class="form-group mt-3">
                        <label for="eventDescription">Description</label>
                        <textarea class="form-control" id="eventDescription" rows="3"></textarea>
                    </div>
                    <div class="form-group mt-3">
                        <label>
                            <input type="checkbox" id="eventAllDay"> All Day
                        </label>
                    </div>
                    <div id="dateTimeSection" class="mt-3">
                        <div class="form-group">
                            <label for="eventStart">Start Date & Time</label>
                            <input type="datetime-local" class="form-control" id="eventStart" required>
                        </div>
                        <div class="form-group mt-3">
                            <label for="eventEnd">End Date & Time</label>
                            <input type="datetime-local" class="form-control" id="eventEnd" required>
                        </div>
                    </div>
                    <div id="allDayDateSection" class="form-group mt-3" style="display: none;">
                        <label for="eventDate">Date</label>
                        <input type="date" class="form-control" id="eventDate">
                    </div>
                    <div class="form-group mt-3">
                        <label for="eventColor">Color</label>
                        <select class="form-control" id="eventColor">
                            <option value="#1E90FF" selected>Blue</option>
                            <option value="#FF6347">Red</option>
                            <option value="#32CD32">Green</option>
                            <option value="#FFD700">Yellow</option>
                            <option value="#8A2BE2">Purple</option>
                        </select>
                    </div>

                    <!-- Recurrence Options -->
                    <div class="form-group mt-4">
                        <label>Recurrence</label>
                        <select id="recurrenceOption" class="form-control">
                            <option value="none">None</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <!-- Recurrence End Date -->
                    <div id="recurrenceEndDateSection" class="form-group mt-3" style="display: none;">
                        <label for="recurrenceEndDate">End Date for Recurrence</label>
                        <input type="date" class="form-control" id="recurrenceEndDate">
                    </div>
                    <div id="customRecurrenceSection" class="mt-3" style="display: none;">
                        <label>Repeat</label>
                        <div class="form-row">
                            <div class="col">
                                <input type="number" id="repeatInterval" class="form-control" placeholder="Every" min="1" value="1">
                            </div>
                            <div class="col">
                                <select id="repeatFrequency" class="form-control">
                                    <option value="week">Week(s)</option>
                                    <option value="month">Month(s)</option>
                                </select>
                            </div>
                        </div>
                        <label class="mt-2">Repeat on</label>
                        <div class="d-flex justify-content-between">
                            <div><input type="checkbox" value="SU"> Sun</div>
                            <div><input type="checkbox" value="MO"> Mon</div>
                            <div><input type="checkbox" value="TU"> Tue</div>
                            <div><input type="checkbox" value="WE"> Wed</div>
                            <div><input type="checkbox" value="TH"> Thu</div>
                            <div><input type="checkbox" value="FR"> Fri</div>
                            <div><input type="checkbox" value="SA"> Sat</div>
                        </div>

                        <!-- Recurrence End Options -->
                        <label class="mt-3">Ends</label>
                        <div>
                            <div class="form-check">
                                <input type="radio" id="endNever" name="repeatEnds" value="never" class="form-check-input" checked>
                                <label class="form-check-label" for="endNever">Never</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="endOn" name="repeatEnds" value="on" class="form-check-input">
                                <label class="form-check-label" for="endOn">On</label>
                                <input type="date" id="endDate" class="form-control mt-1" style="display: none;">
                            </div>
                            <div class="form-check">
                                <input type="radio" id="endAfter" name="repeatEnds" value="after" class="form-check-input">
                                <label class="form-check-label" for="endAfter">After</label>
                                <input type="number" id="endAfterOccurrences" class="form-control mt-1" placeholder="Occurrences" style="display: none;">
                            </div>
                        </div>
                    </div>
                    <div class="form-group mt-3">
                        <label for="inviteUsernames">Invite Users</label>
                        <input type="text" class="form-control" id="inviteUsernames" placeholder="Start typing a username..." autocomplete="off">
                        <div id="selectedInviteUsers" class="list-group mt-2"></div>
                        <div id="inviteSuggestions" class="list-group position-absolute w-100" style="z-index: 1000;"></div>
                    </div>                    
                    <button type="submit" class="btn btn-primary mt-4">Add Event</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
    var calendarEl = document.getElementById('calendar');
    var calendarTitleEl = document.getElementById('calendarTitle');
    const orgId = calendarEl.getAttribute('data-org-id');
    let selectedDate = new Date();

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: false,
        selectable: true,
        editable: true,
        events: `/${orgId}/events/`,
        dayMaxEvents: true,

        datesSet: function (info) {
            const formattedDate = new Intl.DateTimeFormat('en-US', {
                month: 'long',
                year: 'numeric'
            }).format(info.view.currentStart);
            calendarTitleEl.innerText = formattedDate;
        },

        dateClick: function(info) {
            selectedDate = new Date(info.date);
            openEventModal(selectedDate);
        },

        eventClick: function (info) {
            if (!info.event || !info.jsEvent) return;
            info.jsEvent.preventDefault();
            showEventDetails(info.event, info.jsEvent.pageX, info.jsEvent.pageY);
        },

        views: {
            timeGridWeek: { type: 'timeGrid', duration: { days: 7 }, buttonText: 'Week', allDaySlot: true },
            dayGridMonth: { buttonText: 'Month' }
        }
    });

    document.getElementById('toggleMonthlyView').addEventListener('click', function () {
        calendar.changeView('dayGridMonth');
    });
    document.getElementById('toggleWeeklyView').addEventListener('click', function () {
        calendar.changeView('timeGridWeek');
    });
    document.getElementById('prevButton').addEventListener('click', function () {
        calendar.prev();
    });
    document.getElementById('nextButton').addEventListener('click', function () {
        calendar.next();
    });
    document.getElementById('addEventButton').addEventListener('click', function () {
        console.log("Add Event button clicked");  // Confirm button click is recognized
        openEventModal(new Date());  // Open modal with today's date as default
    });


    function openEventModal(date) {
        console.log("openEventModal function triggered with date:", date);  // Confirm function is triggered

        document.getElementById('eventForm').reset();
        document.getElementById('eventDate').value = date.toISOString().split("T")[0];
        document.getElementById('eventStart').value = date.toISOString().split("T")[0] + "T00:00";
        document.getElementById('eventEnd').value = date.toISOString().split("T")[0] + "T23:59";
        updateRecurrenceOptions(date);
        const modal = document.getElementById('eventModal');
        modal.style.display = 'block';  // Show the modal
        modal.setAttribute('aria-hidden', 'false');  // Make it accessible
        modal.classList.add('show');  // Add the Bootstrap `show` class
    }

    function updateRecurrenceOptions(date) {
        const dayOfWeek = date.toLocaleDateString('en-US', { weekday: 'long' });
        document.getElementById('recurrenceOption').innerHTML = `
            <option value="none">None</option>
            <option value="daily">Daily (Next 30 days)</option>
            <option value="weekly">Weekly on ${dayOfWeek}</option>
            <option value="biweekly">Bi-Weekly on ${dayOfWeek}</option>
            <option value="weekday">Every Weekday</option>
        `;
    }

    // Invite User Search and Selection
    const inviteUserInput = document.getElementById('inviteUsernames');
    const inviteSuggestionsBox = document.getElementById('inviteSuggestions');
    const selectedInviteUsersBox = document.getElementById('selectedInviteUsers');
    let selectedInviteUsers = [];

    inviteUserInput.addEventListener('input', function() {
        const query = this.value;
        if (query.length > 0) {
            fetch(`{% url 'search_users' %}?query=${encodeURIComponent(query)}`, {
                method: 'GET',
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(response => response.json())
            .then(data => {
                inviteSuggestionsBox.innerHTML = '';
                if (data.users.length > 0) {
                    data.users.forEach(user => {
                        const suggestionItem = document.createElement('a');
                        suggestionItem.href = '#';
                        suggestionItem.className = 'list-group-item list-group-item-action d-flex align-items-center';
                        suggestionItem.onclick = function(e) {
                            e.preventDefault();
                            if (!selectedInviteUsers.includes(user.username)) {
                                selectedInviteUsers.push(user.username);
                                inviteUserInput.value = '';
                                inviteSuggestionsBox.innerHTML = '';

                                const userItem = document.createElement('span');
                                userItem.className = 'badge bg-secondary m-1';
                                userItem.innerText = user.username;

                                const removeButton = document.createElement('span');
                                removeButton.className = 'ms-1 text-danger';
                                removeButton.innerHTML = '&times;';
                                removeButton.style.cursor = 'pointer';
                                removeButton.onclick = function() {
                                    selectedInviteUsers = selectedInviteUsers.filter(u => u !== user.username);
                                    selectedInviteUsersBox.removeChild(userItem);
                                };

                                userItem.appendChild(removeButton);
                                selectedInviteUsersBox.appendChild(userItem);
                            }
                        };

                        const profilePic = document.createElement('img');
                        profilePic.src = user.profile_picture || "{% static 'img/default-profile.jpg' %}";
                        profilePic.className = 'rounded-circle me-2';
                        profilePic.style.width = '30px';
                        profilePic.style.height = '30px';

                        suggestionItem.appendChild(profilePic);
                        suggestionItem.appendChild(document.createTextNode(user.username));
                        inviteSuggestionsBox.appendChild(suggestionItem);
                    });
                } else {
                    const noResultsItem = document.createElement('a');
                    noResultsItem.className = 'list-group-item list-group-item-action disabled';
                    noResultsItem.textContent = 'No users found';
                    inviteSuggestionsBox.appendChild(noResultsItem);
                }
            })
            .catch(error => console.error('Error fetching users:', error));
        } else {
            inviteSuggestionsBox.innerHTML = '';
        }
    });

    document.getElementById('eventForm').addEventListener('submit', function (e) {
        const title = document.getElementById('eventTitle').value;
        const description = document.getElementById('eventDescription').value;
        const allDay = document.getElementById('eventAllDay').checked;
        const start = allDay ? document.getElementById('eventDate').value : document.getElementById('eventStart').value;
        const end = allDay ? document.getElementById('eventDate').value : document.getElementById('eventEnd').value;
        const color = document.getElementById('eventColor').value || '#1E90FF';
        const inviteUsers = selectedInviteUsers; // This should hold the list of selected users
        let recurrence = null;

        let recurrenceType = document.getElementById('recurrenceOption').value;
        if (recurrenceType !== 'none') {
            let recurrenceDays = [];
            const recurrenceEndDate = document.getElementById('recurrenceEndDate').value;

            if (recurrenceType === 'daily') {
                recurrenceDays = [];
            } else if (recurrenceType === 'weekly' || recurrenceType === 'biweekly') {
                const dayOfWeek = selectedDate.getDay();
                recurrenceDays = [dayOfWeek];
            } else if (recurrenceType === 'weekday') {
                recurrenceDays = [1, 2, 3, 4, 5];
            }

            recurrence = {
                type: recurrenceType,
                interval: recurrenceType === 'biweekly' ? 2 : 1,
                maxOccurrences: 30,
                endDate: recurrenceEndDate || null,
                days: recurrenceDays
            };
        }

        fetch(`/${orgId}/add-event/`, { 
            method: 'POST', 
            headers: { 
                'Content-Type': 'application/json', 
                'X-CSRFToken': '{{ csrf_token }}' 
            },
            body: JSON.stringify({ title, description, start, end, color, all_day: allDay, invite_users: inviteUsers })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                $('#eventModal').modal('hide');
                calendar.refetchEvents();
            } else {
                alert('Error adding event: ' + data.message);
            }
        })
        .catch(error => console.error('Error adding event:', error));
    });
    document.querySelector('.close').addEventListener('click', function () {
        const modal = document.getElementById('eventModal');
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden', 'true');
        modal.classList.remove('show');
    });

    function showEventDetails(event, x, y) {
        let eventDetailBox = document.getElementById('eventDetailBox');
        eventDetailBox.style.left = `${x}px`;
        eventDetailBox.style.top = `${y}px`;
        eventDetailBox.style.display = 'block';

        let viewTaskBtn = '';
        if (event.extendedProps.project_task) {
            const projId = event.extendedProps.project_task.project_id;
            const orgId = {{ org_id }};  // Make sure org_id is in your template context
            viewTaskBtn = `<a href="/projects/${orgId}/${projId}/" class="btn btn-sm btn-primary mt-2" target="_blank">View Task in Project</a>`;
        }

        eventDetailBox.innerHTML = `
            <strong>${event.title}</strong><br>
            <p>${event.extendedProps.description || 'No description available.'}</p>
            ${viewTaskBtn}
            <button id="deleteEventButton" class="btn btn-danger btn-sm mt-2">Remove</button>
        `;
        document.getElementById('deleteEventButton').onclick = function () {
            if (confirm('Are you sure you want to delete this event?')) {
                fetch(`/${orgId}/delete-calendar-event/${event.id}/`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': '{{ csrf_token }}' }
                })
                .then(response => {
                    if (response.ok) {
                        eventDetailBox.style.display = 'none';
                        calendar.refetchEvents();
                    } else {
                        alert('Failed to delete the event.');
                    }
                })
                .catch(error => console.error('Error deleting event:', error));
            }
        };
    }

    let eventDetailBox = document.createElement('div');
    eventDetailBox.id = 'eventDetailBox';
    eventDetailBox.style.display = 'none';
    eventDetailBox.style.position = 'absolute';
    eventDetailBox.style.backgroundColor = '#fff';
    eventDetailBox.style.border = '1px solid #ccc';
    eventDetailBox.style.padding = '15px';
    eventDetailBox.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.2)';
    eventDetailBox.style.zIndex = '1000';
    eventDetailBox.style.width = '200px';
    document.body.appendChild(eventDetailBox);

    document.addEventListener('click', function (event) {
        if (!event.target.closest('#eventDetailBox') && !event.target.closest('.fc-event')) {
            eventDetailBox.style.display = 'none';
        }
    });

    calendar.render();
});
</script>

<style>
    #eventDetailBox {
        max-width: 250px;
        border-radius: 8px;
    }
    #eventDetailBox strong {
        font-size: 1.1em;
    }
    #eventDetailBox p {
        margin: 10px 0;
        font-size: 0.9em;
    }

    .calendar-container {
        max-width: 100%;
        height: 85vh;
        margin: 0 auto;
    }
    .modal {
        display: nonel
    }
    .modal.show {
        display: block; /* Show when triggered */
    }
    .fc-day-more {
        cursor: pointer;
        color: blue;
    }
    .fc .fc-daygrid-day-frame {
        max-height: 80px;
        overflow: hidden;
        position: relative;
    }
    .fc-daygrid-day-frame.expanded {
        max-height: none;
    }
</style>
{% endblock %}
