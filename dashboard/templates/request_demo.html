{% extends "bases.html" %}
{% load static %}
{% block title %}algoRhythm - Request a Demo{% endblock %}
{% block content %}
<style>
    .request-demo-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f4f4;
        padding: 60px 20px;
    }
    .request-demo-content {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 100%;
        max-width: 500px;
    }
    .request-demo-content h2 {
        margin-bottom: 20px;
        color: #ff8000;
        font-family: 'Source Sans Pro', sans-serif;
    }
    .request-demo-content label {
        display: block;
        text-align: left;
        margin-bottom: 6px;
        color: #666;
        font-weight: 500;
    }
    .request-demo-content input,
    .request-demo-content textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-family: 'Roboto', sans-serif;
    }
    .request-demo-content textarea {
        resize: vertical;
    }
    .request-demo-content button {
        width: 100%;
        padding: 12px;
        background-color: #ff8000;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s ease;
    }
    .request-demo-content button:hover {
        background-color: #e67e00;
    }
</style>

<div class="request-demo-wrapper">
    <div class="request-demo-content">
        <h2>Request a Demo</h2>
        {% if submission_success %}
            <div id="successMessage" class="alert alert-success d-flex align-items-center mt-3" role="alert" style="justify-content:center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="green" class="bi bi-check-circle-fill me-2" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM6.97 10.03a.75.75 0 0 0 1.07 0l3.992-3.992a.75.75 0 1 0-1.06-1.06L7.5 8.439 5.53 6.47a.75.75 0 0 0-1.06 1.06l2.5 2.5z"/>
                </svg>
                Your demo request was submitted successfully!
            </div>

            <script>
                // Optional: Clear form fields after 2 seconds
                setTimeout(() => {
                    document.querySelector("form").reset();
                }, 2000);

                // Optional: Fade out the success message after 5 seconds
                setTimeout(() => {
                    document.getElementById("successMessage").style.display = 'none';
                }, 5000);
            </script>
        {% endif %}
        <form method="POST" action="{% url 'request_demo' %}">
            {% csrf_token %}

            <label for="first_name">First Name*</label>
            <input type="text" id="first_name" name="first_name" required>

            <label for="last_name">Last Name*</label>
            <input type="text" id="last_name" name="last_name" required>

            <label for="email">Email Address*</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number*</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="job_title">Job Title</label>
            <input type="text" id="job_title" name="job_title">
            <label for="company">Company Name*</label>
            <input type="text" id="company" name="company" required>

            <label for="interest">What Are You Looking For?*</label>
            <select id="interest" name="interest" required>
                <option value="" disabled selected>Select One</option>
                <option value="Award Management">Award Management</option>
                <option value="Research Compliance">Research Compliance</option>
                <option value="Financial Management">Financial Management</option>
                <option value="Research Operations">Research Operations</option>
                <option value="Complete Suite">Complete Suite</option>
            </select>

            <label for="message">Message*</label>
            <textarea id="message" name="message" rows="4" required></textarea>


            <button type="submit">Submit Request</button>
        </form>

    </div>
</div>
{% endblock %}
