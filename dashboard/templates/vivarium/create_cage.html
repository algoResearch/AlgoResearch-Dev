{% extends "base/base_dashboard.html" %}

{% block title %}Create Cages{% endblock %}
{% block breadcrumb_title %}Create Cages{% endblock %}
{% block page_title %}Setup Cages and Animals{% endblock %}

{% block content %}
<div class="container">
    <h3>Setup Cages and Animals</h3>

    <!-- Step 1: Number of Cages and Population per Cage -->
    <form id="cage-setup-form" method="post" action="{% url 'setup_cages_animals' org_id=org_id %}">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="num_cages">Number of Cages</label>
            <input type="number" id="num_cages" name="num_cages" class="form-control" min="1" required>
        </div>

        <div id="cage-population-section">
            <!-- Cage population fields will be dynamically added here -->
        </div>

        <button type="button" class="btn btn-primary" onclick="generateCageFields()">Next</button>
    </form>
</div>

<script>
    function generateCageFields() {
        const numCages = document.getElementById('num_cages').value;
        const cagePopulationSection = document.getElementById('cage-population-section');

        cagePopulationSection.innerHTML = ''; // Clear previous entries

        for (let i = 1; i <= numCages; i++) {
            cagePopulationSection.innerHTML += `
                <div class="mb-3">
                    <label for="cage_name_${i}">Cage ${i} Name</label>
                    <input type="text" id="cage_name_${i}" name="cage_name_${i}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="population_${i}">Population for Cage ${i}</label>
                    <input type="number" id="population_${i}" name="population_${i}" class="form-control" min="1" required>
                </div>
            `;
        }

        // Show "Next" button to proceed to animal details input
        document.getElementById('cage-setup-form').innerHTML += `
            <button type="button" class="btn btn-primary mt-3" onclick="generateAnimalFields()">Next</button>
        `;
    }

    function generateAnimalFields() {
        const numCages = document.getElementById('num_cages').value;
        const animalDetailsSection = document.getElementById('animal-details-section');
        animalDetailsSection.innerHTML = ''; // Clear previous entries

        // Loop through each cage and generate fields for each animal
        for (let i = 1; i <= numCages; i++) {
            const cageName = document.getElementById(`cage_name_${i}`).value;
            const population = document.getElementById(`population_${i}`).value;

            for (let j = 1; j <= population; j++) {
                animalDetailsSection.innerHTML += `
                    <div class="row mb-3">
                        <div class="col-md-2">
                            <label>Cage Name</label>
                            <input type="text" name="cage_${i}_name" class="form-control" value="${cageName}" readonly>
                        </div>
                        <div class="col-md-2">
                            <label>Animal ID</label>
                            <input type="text" name="animal_id_${i}_${j}" class="form-control" value="Animal ${j}" readonly>
                        </div>
                        <div class="col-md-2">
                            <label>Sex</label>
                            <select name="sex_${i}_${j}" class="form-control" required>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label>Date of Birth</label>
                            <input type="date" name="date_of_birth_${i}_${j}" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label>Species</label>
                            <input type="text" name="species_${i}_${j}" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label>Strain</label>
                            <input type="text" name="strain_${i}_${j}" class="form-control" required>
                        </div>
                    </div>
                `;
            }
        }

        // Hide the cage setup form and show the animal details form
        document.getElementById('cage-setup-form').style.display = 'none';
        document.getElementById('animal-details-form').style.display = 'block';
    }
</script>

<style>
    .form-control {
        margin-top: 5px;
    }
</style>
{% endblock %}
