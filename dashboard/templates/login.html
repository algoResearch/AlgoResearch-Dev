{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: orange;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .login-content h2 {
            margin-bottom: 20px;
            color: #ff8800;
        }
        .login-content label {
            display: block;
            text-align: left;
            margin-bottom: 10px;
            color: #666;
        }
        .login-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-content button {
            width: 100%;
            padding: 10px;
            background-color: #ff8800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-content button:hover {
            background-color: #ff8800;
        }
        .login-content p {
            margin-top: 20px;
            color: #666;
        }
        .login-content .error {
            color: red;
            font-size: 0.875rem;
            margin-top: 5px;
            text-align: left;
        }
        .non-field-error {
            color: red;
            font-size: 1rem;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-content">
        <h2>Login</h2>
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <!-- Non-field error (e.g., invalid username/password) -->
            {% if form.non_field_errors %}
                <p class="non-field-error">{{ form.non_field_errors }}</p>
            {% endif %}

            <!-- Username field -->
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required autofocus aria-label="Username" 
                   aria-describedby="username-error">
            {% if form.username.errors %}
                <p class="error" id="username-error">{{ form.username.errors }}</p>
            {% endif %}

            <!-- Password field -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required aria-label="Password" 
                   aria-describedby="password-error">
            {% if form.password.errors %}
                <p class="error" id="password-error">{{ form.password.errors }}</p>
            {% endif %}

            <button type="submit" class="cta">Login</button>
        </form>
    </div>
</body>
</html>
