{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Authenticator Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Roboto, sans-serif; background:#F36C21; height:100vh; display:flex; align-items:center; justify-content:center; margin:0;}
    .card { background:#fff; padding:24px; border-radius:10px; width:100%; max-width:420px; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    label { display:block; margin:6px 0; color:#666; }
    input { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; }
    button { width:100%; padding:10px; background:#F36C21; color:#fff; border:0; border-radius:6px; cursor:pointer; margin-top:12px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="{% static 'img/login basic.png' %}" alt="Logo" style="max-width:150px; display:block; margin:0 auto 16px;">
    <h2 style="text-align:center; color:#F36C21; margin:0 0 8px;">Authenticator code</h2>
    <p style="text-align:center; color:#666; margin:0 0 12px;">Enter the 6-digit code from your authenticator app.</p>

    <form method="post">
      {% csrf_token %}
      <label for="id_token">Code</label>
      {{ form.token }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Verify</button>
    </form>
  </div>
</body>
</html>
