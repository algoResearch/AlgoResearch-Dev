{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                135deg,
                rgba(255,255,255,0.15) 0px,
                rgba(255,255,255,0.15) 2px,
                transparent 2px,
                transparent 20px
            );
            z-index: 0;
            pointer-events: none;
        }
        body {
            position: relative;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F36C21;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            z-index: 1;
            position: relative;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
        }

        .login-content h2 {
            margin-bottom: 20px;
            color: #F36C21;
        }

        .login-content label {
            display: block;
            text-align: left;
            margin-bottom: 10px;
            color: #666;
        }

        .login-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-content button {
            width: 100%;
            padding: 10px;
            background-color: #F36C21;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-content button:hover {
            background-color: #ff8800;
        }

        .login-content .error {
            color: red;
            font-size: 0.875rem;
            text-align: left;
            margin-bottom: 10px;
        }

        .login-content .message {
            color: red;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-content">
        <img src="{% static 'img/login basic.png' %}" alt="algoRhythm Logo" class="login-logo">
      

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" id="username" name="username" placeholder="Username" required autofocus>
            <button type="submit">Next</button>
        </form>
    </div>
</body>
</html>
