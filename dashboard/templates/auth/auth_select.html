{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Choose 2FA</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Roboto, sans-serif; background:#F36C21; height:100vh; display:flex; align-items:center; justify-content:center; margin:0;}
    .card { background:#fff; padding:24px; border-radius:10px; width:100%; max-width:420px; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    .actions { margin-top:16px; display:flex; gap:8px; }
    button { width:100%; padding:10px; background:#F36C21; color:#fff; border:0; border-radius:6px; cursor:pointer; }
    .help { font-size:.9rem; color:#666; margin-top:8px; }
    .option { margin:12px 0; }
    a.inline { color:#F36C21; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="{% static 'img/login basic.png' %}" alt="Logo" style="max-width:150px; display:block; margin:0 auto 16px;">
    <h2 style="text-align:center; color:#F36C21; margin:0 0 8px;">Two-Factor Authentication</h2>
    <p class="help" style="text-align:center;">Choose how you want to verify this login.</p>

    <form method="post">
      {% csrf_token %}
      <div class="option">
        <label><input type="radio" name="method" value="email" {% if not has_totp %}checked{% endif %}> Email a 6-digit code</label>
      </div>
      <div class="option">
        <label><input type="radio" name="method" value="totp" {% if has_totp %}checked{% endif %}> Authenticator app (TOTP)</label>
      </div>

      <input type="hidden" name="next" value="{{ next }}">
      <div class="actions">
        <button type="submit">Continue</button>
      </div>
    </form>

    {% if not has_totp %}
      <p class="help">Don’t have an authenticator set up? <a class="inline" href="{% url 'two_factor:setup' %}">Set it up now</a>.</p>
    {% endif %}
  </div>
</body>
</html>
