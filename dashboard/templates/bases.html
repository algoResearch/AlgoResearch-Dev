{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}algoRhythm{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet"> {# your extracted styling #}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="{% static 'js/assets/css/nucleo-icons.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="{% static 'js/assets/css/nucleo-svg.css' %}" rel="stylesheet" />
    <link rel="icon" type="image/png" href="{% static 'img/testing-orange.png' %}">
</head>
<body>
    <div style="height: 100px;"></div>
    {% include "partials/navbar.html" %}
    {% block content %}{% endblock %}
    {% include "partials/footer.html" %}
    <script src="{% static 'js/navbar.js' %}"></script>
</body>
</html>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        let lastScrollY = window.scrollY;
        const navbar = document.querySelector('.navbar');

        if (!navbar) return;

        window.addEventListener('scroll', () => {
            const currentScroll = window.scrollY;

            if (currentScroll <= 0) {
                // At top of page — always show navbar
                navbar.style.transform = 'translate(-50%, 0)';
            } else if (currentScroll > lastScrollY) {
                // Scrolling down — hide navbar
                navbar.style.transform = 'translate(-50%, -200%)';
            } else {
                // Scrolling up — show navbar
                navbar.style.transform = 'translate(-50%, 0)';
            }

            lastScrollY = currentScroll;
        });
    });
</script>
