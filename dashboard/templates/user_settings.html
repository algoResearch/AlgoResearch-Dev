{% extends base_template %}

{% load static %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card card-body">
            <h4 class="mb-4">User Settings</h4>

            <form method="post" action="{% url 'update_user_settings' org_id=user.organization.id %}">
                {% csrf_token %}
            
                <!-- Mute All Notifications Toggle -->
                <div class="form-check form-switch mb-3">
                    <input type="checkbox" class="form-check-input" id="muteNotifications" name="mute_notifications" 
                           {% if user.mute_all_notifications %}checked{% endif %}>
                    <label class="form-check-label" for="muteNotifications">
                        Mute All Notifications
                    </label>
                </div>
                <!-- Dark Mode Toggle -->
                <div class="form-check form-switch mb-3">
                    <input type="checkbox" class="form-check-input" id="darkMode" name="dark_mode" 
                        {% if user.dark_mode %}checked{% endif %}>
                    <label class="form-check-label" for="darkMode">
                        Dark Mode
                    </label>
                </div>
                <!-- Profile Visibility Toggle -->
                <div class="form-check form-switch mb-3">
                    <input type="checkbox" class="form-check-input" id="profileVisibility" name="profile_visibility" 
                           {% if user.is_public %}checked{% endif %}>
                    <label class="form-check-label" for="profileVisibility">
                        Public Profile (Uncheck to make your profile private)
                    </label>
                </div>
                <div class="mb-3">
                    <label for="sidebarColor" class="form-label">Sidebar Background Color</label>
                    <input type="color" id="sidebarColor" name="sidebar_color" class="form-control form-control-color"
                           value="{{ user.sidebar_color|default:user.organization.sidebar_color|default:'#115600' }}">
                </div>
                <div class="mb-3">
                    <label for="hoverColor" class="form-label">Hover Highlight Color</label>
                    <input type="color" id="hoverColor" name="hover_color" class="form-control form-control-color"
                           value="{{ user.hover_color|default:user.organization.hover_color|default:'#e1cd10' }}">
                </div>
                <button type="submit" class="btn btn-primary">Save Settings</button>
            </form>            
        </div>
    </div>
</div>
{% endblock %}
