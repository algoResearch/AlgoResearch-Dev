{% extends "base_dashboard.html" %}

{% block title %}Experiment Settings{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <h2>Experiment Settings</h2>
    <form method="post" action="{% url 'experiment_settings' org_id experiment.id %}">
        {% csrf_token %}
        <!-- Weight Metrics -->
        <h4>Weight Metrics</h4>
        <div class="form-group">
            <label for="warning_weight_percentage">Warning Weight Percentage</label>
            <input type="number" step="0.1" class="form-control" id="warning_weight_percentage" name="warning_weight_percentage" value="{{ experiment.warning_weight_percentage }}">
        </div>
        <div class="form-group">
            <label for="removal_weight_percentage">Removal Weight Percentage</label>
            <input type="number" step="0.1" class="form-control" id="removal_weight_percentage" name="removal_weight_percentage" value="{{ experiment.removal_weight_percentage }}">
        </div>

        <!-- Tumor Metrics -->
        <h4 class="mt-4">Tumor Metrics</h4>
        <div class="form-group">
            <label for="tumor_volume_warning">Tumor Volume Warning Threshold (mm³)</label>
            <input type="number" step="0.1" class="form-control" id="tumor_volume_warning" name="tumor_volume_warning" value="{{ experiment.tumor_volume_warning }}">
        </div>
        <div class="form-group">
            <label for="tumor_volume_removal">Tumor Volume Removal Threshold (mm³)</label>
            <input type="number" step="0.1" class="form-control" id="tumor_volume_removal" name="tumor_volume_removal" value="{{ experiment.tumor_volume_removal }}">
        </div>        
        <button type="submit" class="btn btn-primary mt-3">Save Settings</button>
    </form>
</div>
{% endblock %}
