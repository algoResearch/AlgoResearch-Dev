{% extends "base_dashboard.html" %}
{% block title %}Send Task Reminder{% endblock %}
{% block content %}
<div class="container">
    <h2>Send Task Reminder for Experiment: {{ experiment.name }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Task Title</label>
            {{ form.title }}
        </div>

        <div class="form-group">
            <label for="description">Task Description</label>
            {{ form.description }}
        </div>

        <div class="form-group">
            <label for="deadline">Need it Done by (Deadline)</label>
            {{ form.deadline }}
        </div>

        <div class="form-group">
            <label for="recipients">Select Recipients</label>
            <div class="checkbox-list">
                {{ form.recipients }}
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Send Reminder</button>
    </form>
</div>
{% endblock %}
