{% extends "base_dashboard.html" %}
{% block title %}Analytics{% endblock %}

{% block content %}
<div class="analytics-content">
    <h2 class="mb-4">Analytics for {{ experiment.name }}</h2>

    <div class="analytics-controls mb-3 d-flex gap-3 flex-wrap">
        <div>
            <label for="dataTypeSelect" class="form-label">Data Type:</label>
            <select id="dataTypeSelect" class="form-select" onchange="updateChart()">
                <option value="weights">Weight</option>
                <option value="tumor_sizes">Tumor Size</option>
            </select>
        </div>

        <div>
            <label for="viewTypeSelect" class="form-label">View Type:</label>
            <select id="viewTypeSelect" class="form-select" onchange="updateChart()">
                <option value="individual">Individual</option>
                <option value="grouped">Grouped</option>
                <option value="candlestick">Candlestick (High/Low/Median for Groups)</option>
                <option value="comparison">Comparison of Weight vs. Tumor Growth Rate</option>
                <option value="correlation">Correlation Heatmap</option>
                <option value="spider">Group Profiles (Radar Plot)</option>
                <option value="pca">PCA + Cluster Plot</option>
                <option value="forecast">Group Forecast (Weight)</option>
            </select>
        </div>
    </div>

    <div class="card shadow-sm p-3">
        <div id="analyticsChart" style="width: 100%; height: 550px;"></div>
    </div>
</div>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
    const individualData = {{ chart_data|safe }};
    const groupData = {{ group_data|safe }};
    const candlestickData = {{ candlestick_data|safe }};
    const correlationData = {{ correlation_data|safe }};
    const groupProfile = {{ group_profile|safe }};
    const pcaData = {{ pca_data|safe }};
    const forecastData = {{ forecast_data|safe }};

    function getTraces(dataType, viewType) {
        const traces = [];

        if (viewType === "correlation") {
            traces.push({
                z: correlationData,
                x: ['Weight Change (%)', 'Tumor Growth Rate (%)'],
                y: ['Weight Change (%)', 'Tumor Growth Rate (%)'],
                type: 'heatmap',
                colorscale: 'Viridis',
                showscale: true
            });

        } else if (viewType === "spider") {
            const metrics = ['Average Weight', 'Average Tumor Size'];

            for (const groupName in groupProfile) {
                const profile = groupProfile[groupName];
                traces.push({
                    type: 'scatterpolar',
                    r: [profile["Average Weight"], profile["Average Tumor Size"]],
                    theta: metrics,
                    fill: 'toself',
                    name: groupName,
                    marker: { color: profile["Color"] }
                });
            }
           
        } else if (viewType === "comparison") {
            // Placeholder: You can extend this with real comparison data.
            alert("Comparison view is not implemented yet.");
            return [];
        } else if (viewType === "pca") {
            pcaData.forEach(pt => {
                traces.push({
                    x: [pt.x],
                    y: [pt.y],
                    type: 'scatter',
                    mode: 'markers+text',
                    name: `Animal ${pt.animal_id}`,
                    marker: {
                        size: 10,
                        color: pt.color,
                        line: { width: 1, color: '#333' }
                    },
                    text: [`Cluster ${pt.cluster}`],
                    textposition: 'top center'
                });
            });

        } else if (viewType === "forecast") {
            for (const group in forecastData) {
                const fd = forecastData[group];
                traces.push({
                    x: fd.future_days,
                    y: fd.predicted_weights,
                    mode: 'lines+markers',
                    name: `Forecast: ${group}`,
                    line: { dash: 'dashdot', color: fd.color },
                    marker: { symbol: 'circle-open' }
                });
            }
        } else if (viewType === "candlestick") {
            for (const groupName in candlestickData) {
                const group = candlestickData[groupName];
                traces.push({
                    x: group.dates,
                    open: group.medians,
                    high: group.highs,
                    low: group.lows,
                    close: group.medians,
                    type: 'candlestick',
                    name: `Group ${groupName}`,
                    increasing: { line: { color: '#2ca02c' } },
                    decreasing: { line: { color: '#d62728' } }
                });
            }

        } else {
            const data = viewType === "grouped" ? groupData : individualData;

            for (const key in data) {
                const item = data[key];
                const y = item[dataType];
                const x = item.dates.map((_, i) => `Day ${i + 1}`);

                traces.push({
                    x: x,
                    y: y,
                    mode: 'lines+markers',
                    type: 'scatter',
                    name: viewType === "grouped" ? `Group ${key}` : `Animal ${key} (${item.group_name})`,
                    marker: { color: item.color },
                    line: { color: item.color }
                });
            }
        }

        return traces;
    }

    function updateChart() {
        const dataType = document.getElementById("dataTypeSelect").value;
        const viewType = document.getElementById("viewTypeSelect").value;
        let layout;

        switch (viewType) {
            case "correlation":
                layout = {
                    title: 'Correlation Heatmap',
                    xaxis: { title: 'Metric' },
                    yaxis: { title: 'Metric' }
                };
                break;

            case "spider":
                layout = {
                    title: 'Group Profiles (Radar Plot)',
                    polar: {
                        radialaxis: {
                            visible: true,
                            range: [0, Math.max(...Object.values(groupProfile).flatMap(d => [d["Average Weight"], d["Average Tumor Size"]])) * 1.2]
                        }
                    },
                    showlegend: true
                };
                break;
            case "pca":
                layout = {
                    title: 'PCA + Clustering of Animal Profiles',
                    xaxis: { title: 'PC1' },
                    yaxis: { title: 'PC2' }
                };
                break;

            case "forecast":
                layout = {
                    title: 'Group Forecast: Weight Trajectory',
                    xaxis: { title: 'Future Day' },
                    yaxis: { title: 'Predicted Weight (g)' }
                };
                break;
            case "candlestick":
                layout = {
                    title: `Candlestick Chart (${dataType === "weights" ? "Weight" : "Tumor Size"})`,
                    xaxis: { title: 'Date' },
                    yaxis: { title: dataType === "weights" ? "Weight (g)" : "Tumor Size (mm³)" }
                };
                break;

            default:
                layout = {
                    title: dataType === "weights" ? "Weight Over Time" : "Tumor Size Over Time",
                    xaxis: { title: 'Day' },
                    yaxis: { title: dataType === "weights" ? "Weight (g)" : "Tumor Size (mm³)" }
                };
        }

        layout.autosize = true;
        layout.width = document.getElementById("analyticsChart").offsetWidth;
        layout.height = 500;

        const traces = getTraces(dataType, viewType);
        Plotly.newPlot('analyticsChart', traces, layout);
    }

    window.onresize = function() {
        Plotly.relayout('analyticsChart', {
            width: document.getElementById('analyticsChart').offsetWidth,
            height: 500
        });
    };

    updateChart();
</script>

<style>
.analytics-content {
    margin: 20px;
}
.analytics-controls select {
    min-width: 200px;
}
</style>
{% endblock %}
