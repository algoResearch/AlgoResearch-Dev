{% extends "base/base_dashboard.html" %}

{% block title %}Analytics{% endblock %}

{% block content %}
<div class="analytics-content">
    <h2>Analytics for {{ experiment.name }}</h2>

    <div class="analytics-controls">
        <label for="dataTypeSelect">Data Type:</label>
        <select id="dataTypeSelect" onchange="updateChart()">
            <option value="weights">Weight</option>
            <option value="tumor_sizes">Tumor Size</option>
        </select>

        <label for="viewTypeSelect">View Type:</label>
        <select id="viewTypeSelect" onchange="updateChart()">
            <option value="individual">Individual</option>
            <option value="grouped">Grouped</option>
            <option value="candlestick">Candlestick (High/Low/Median for Groups)</option>
            <option value="comparison">Comparison of Weight vs. Tumor Growth Rate</option>
            <option value="correlation">Correlation Heatmap (Weight Change vs. Tumor Growth)</option>
        </select>
    </div>

    <div id="analyticsChart" style="width: 100%; height: 500px;"></div>
</div>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
    const individualData = {{ chart_data|safe }};
    const groupData = {{ group_data|safe }};
    const candlestickData = {{ candlestick_data|safe }};
    const correlationData = {{ correlation_data|safe }};

    function getTraces(dataType, viewType) {
        const traces = [];

        if (viewType === "correlation") {
            traces.push({
                z: correlationData,
                x: ['Weight Change (%)', 'Tumor Growth Rate (%)'],
                y: ['Weight Change (%)', 'Tumor Growth Rate (%)'],
                type: 'heatmap',
                colorscale: 'Viridis',
                showscale: true
            });
        } else if (viewType === "comparison") {
            scatterData.forEach(dataItem => {
                traces.push({
                    x: [dataItem.final_weight],
                    y: [dataItem.tumor_growth_rate],
                    mode: 'markers',
                    type: 'scatter',
                    name: `Animal ${dataItem.animal_index}`,
                    marker: {
                        color: dataItem.group_color,
                        size: 10,
                        opacity: 0.8
                    }
                });
            });
        } else if (viewType === "candlestick") {
            for (const groupName in candlestickData) {
                if (candlestickData.hasOwnProperty(groupName)) {
                    const groupCandlestick = candlestickData[groupName];

                    // Configure candlestick to show High, Low, and Median
                    traces.push({
                        x: groupCandlestick.dates,
                        open: groupCandlestick.medians,
                        high: groupCandlestick.highs,
                        low: groupCandlestick.lows,
                        close: groupCandlestick.medians,
                        type: 'candlestick',
                        name: `Group ${groupName}`,
                        xaxis: 'x',
                        yaxis: 'y',
                        increasing: { line: { color: '#2ca02c' } }, // Green for increasing
                        decreasing: { line: { color: '#d62728' } }  // Red for decreasing
                    });
                }
            }
        } else {
            const data = viewType === "grouped" ? groupData : individualData;
            for (const key in data) {
                if (data.hasOwnProperty(key)) {
                    const dataItem = data[key];
                    const yValues = dataItem[dataType];
                    const weighInLabels = dataItem.dates.map((_, index) => `Weigh In ${index + 1}`);

                    traces.push({
                        x: weighInLabels,
                        y: yValues,
                        mode: 'lines+markers',
                        type: 'scatter',
                        name: viewType === "grouped" ? `Group ${key}` : `Animal ${key} (${dataItem.group_name})`,
                        marker: { color: dataItem.color },
                        line: { color: dataItem.color, shape: 'linear' }
                    });
                }
            }
        }

        return traces;
    }

    function updateChart() {
        const dataType = document.getElementById("dataTypeSelect").value;
        const viewType = document.getElementById("viewTypeSelect").value;

        let layout;

        if (viewType === "correlation") {
            layout = {
                title: 'Correlation Heatmap (Weight Change vs. Tumor Growth)',
                xaxis: { title: 'Metrics' },
                yaxis: { title: 'Metrics' },
                autosize: true,
                width: document.getElementById("analyticsChart").offsetWidth,
                height: 500
            };
        } else if (viewType === "comparison") {
            layout = {
                title: 'Comparison of Weight vs. Tumor Growth Rate per Animal',
                xaxis: { title: 'Final Weight (g)' },
                yaxis: { title: 'Tumor Growth Rate (mm³/day)' },
                autosize: true,
                width: document.getElementById("analyticsChart").offsetWidth,
                height: 500
            };
        } else if (viewType === "candlestick") {
            layout = {
                title: `Candlestick Chart (${dataType === "weights" ? "Weight" : "Tumor Size"})`,
                xaxis: { title: 'Dates' },
                yaxis: { title: dataType === "weights" ? "Weight (g)" : "Tumor Size (mm³)" },
                autosize: true,
                width: document.getElementById("analyticsChart").offsetWidth,
                height: 500
            };
        } else {
            layout = {
                title: dataType === "weights" ? "Weight Over Time" : "Tumor Size Over Time",
                xaxis: { title: 'Weigh In' },
                yaxis: { title: dataType === "weights" ? "Weight (g)" : "Tumor Size (mm³)" },
                autosize: true,
                width: document.getElementById("analyticsChart").offsetWidth,
                height: 500
            };
        }

        Plotly.newPlot('analyticsChart', getTraces(dataType, viewType), layout);
    }

    // Initial chart render
    updateChart();

    // Handle window resize to dynamically adjust the chart size
    window.onresize = function() {
        Plotly.relayout('analyticsChart', {
            width: document.getElementById('analyticsChart').offsetWidth,
            height: 500
        });
    };
</script>

<style>
    .analytics-content {
        margin: 20px;
    }
    
    .analytics-controls {
        margin-bottom: 20px;
    }
</style>
{% endblock %}
