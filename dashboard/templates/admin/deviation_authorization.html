{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deviation Authorization</title>

  <style>
    body { font-family: "Times New Roman", serif; }
    .header { display:flex; align-items:flex-start; justify-content:space-between; margin: 24px 0 12px; }
    .title { font-size: 22px; font-weight: 700; text-align:center; flex:1; }
    .omb { font-size: 12px; text-align:right; min-width: 240px; }
    .panel { border:1px solid #000; padding:10px; }
    .prompt { font-size: 14px; margin-bottom:8px; }
    .box { background:#dfe6ff; border:1px solid #999; padding:6px; min-height:420px; }
    textarea { width: 100%; border: none; outline: none; background: transparent; resize: vertical; }
    .actions { margin-top: 16px; display:flex; gap:8px; }
    .btn { padding:8px 12px; border:1px solid #333; background:#f8f8f8; cursor:pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div style="width:240px"></div>
    <div class="title">Deviation Authorization (If Applicable)</div>
    <div class="omb">
      OMB Number: 3145-0058<br>
      Expiration Date: 10/31/2025
    </div>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="panel">
      <div class="prompt">
        Enter text for the Deviation Authorization information in the box below (if applicable):
      </div>
      <div class="box">
        {{ form.deviation_text }}
      </div>
    </div>

    <div class="actions">
      <button class="btn" type="submit" name="save_draft" value="1">Save Draft</button>
      <button class="btn" type="submit" name="save_continue" value="1">Save &amp; Continue</button>
    </div>
  </form>
</body>
</html>
