{% load static %}

{% block content %}
<div class="container">
    <h2>RR Other Information</h2>
    {% if form.id %}
        <form id="rr-other-info-form" method="POST" enctype="multipart/form-data"
          action="{% url 'save_filled_form' org_id=org_id form_id=form.id %}">
    
    {% endif %}
        {% csrf_token %}
        
        <!-- 1. Are Human Subjects Involved? -->
        <div class="form-group">
            <label>Are Human Subjects Involved? <span class="text-danger">*</span></label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="human_subjects" id="human_subjects_yes" value="Yes" required>
                <label class="form-check-label" for="human_subjects_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="human_subjects" id="human_subjects_no" value="No">
                <label class="form-check-label" for="human_subjects_no">No</label>
            </div>
        </div>

        <!-- 1.a. Is the Project Exempt? (Hidden Initially) -->
        <div id="project-exempt-section" class="d-none">
            <label>Is the Project Exempt from Federal Regulations?</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="project_exempt" id="project_exempt_yes" value="Yes">
                <label class="form-check-label" for="project_exempt_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="project_exempt" id="project_exempt_no" value="No">
                <label class="form-check-label" for="project_exempt_no">No</label>
            </div>
        </div>

        <!-- Exemption Numbers (Hidden Initially) -->
        <div id="exemption-numbers-section" class="d-none">
            <label>Select Exemption Number(s):</label>
            <div class="form-check">
                {% for i in "12345678" %}
                <input class="form-check-input" type="checkbox" name="exemption_numbers" value="{{ i }}" id="exemption_{{ i }}">
                <label class="form-check-label" for="exemption_{{ i }}">Exemption {{ i }}</label><br>
                {% endfor %}
            </div>
        </div>

        <!-- IRB Review Pending (Hidden Initially) -->
        <div id="irb-review-section" class="d-none">
            <label>If No, is the IRB Review Pending?</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="irb_pending" id="irb_pending_yes" value="Yes">
                <label class="form-check-label" for="irb_pending_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="irb_pending" id="irb_pending_no" value="No">
                <label class="form-check-label" for="irb_pending_no">No</label>
            </div>
        </div>

        <!-- IRB Approval Date (Hidden Initially) -->
        <div id="irb-approval-date-section" class="d-none">
            <label for="irb_approval_date">IRB Approval Date:</label>
            <input type="date" name="irb_approval_date" id="irb_approval_date" class="form-control">
        </div>

        <!-- Human Subject Assurance Number (Hidden Initially) -->
        <div id="human-assurance-section" class="d-none">
            <label for="human_assurance_number">Human Subject Assurance Number:</label>
            <input type="text" name="human_assurance_number" id="human_assurance_number" class="form-control">
        </div>
        <!-- Question 2: Are Vertebrate Animals Used? -->
        <div class="form-group">
            <label>Are Vertebrate Animals Used? <span class="text-danger">*</span></label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="vertebrate_animals" id="vertebrate_yes" value="Yes" required>
                <label class="form-check-label" for="vertebrate_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="vertebrate_animals" id="vertebrate_no" value="No">
                <label class="form-check-label" for="vertebrate_no">No</label>
            </div>
        </div>

        <!-- 2.a. Is the IACUC review Pending? (Hidden Initially) -->
        <div id="iacuc-review-section" class="d-none">
            <label>Is the IACUC review Pending?</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="iacuc_pending" id="iacuc_pending_yes" value="Yes">
                <label class="form-check-label" for="iacuc_pending_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="iacuc_pending" id="iacuc_pending_no" value="No">
                <label class="form-check-label" for="iacuc_pending_no">No</label>
            </div>
        </div>

        <!-- 2.a. IACUC Approval Date (Hidden Initially) -->
        <div id="iacuc-approval-date-section" class="d-none">
            <label for="iacuc_approval_date">IACUC Approval Date:</label>
            <input type="date" name="iacuc_approval_date" id="iacuc_approval_date" class="form-control">
        </div>

        <!-- 2.a. Animal Welfare Assurance Number (Hidden Initially) -->
        <div id="animal-welfare-section" class="d-none">
            <label for="animal_welfare_number">Animal Welfare Assurance Number:</label>
            <input type="text" name="animal_welfare_number" id="animal_welfare_number" class="form-control">
        </div>
        <!-- Question 3: Proprietary/Privileged Information -->
        <div class="form-group">
            <label>Is proprietary/privileged information included in the application? <span class="text-danger">*</span></label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="proprietary_info" id="proprietary_yes" value="Yes" required>
                <label class="form-check-label" for="proprietary_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="proprietary_info" id="proprietary_no" value="No">
                <label class="form-check-label" for="proprietary_no">No</label>
            </div>
        </div>
        <!-- Question 4.a. Does this project have an actual or potential environmental impact? -->
        <div class="form-group">
            <label>4.a. Does this project have an actual or potential impact - positive or negative - on the environment? <span class="text-danger">*</span></label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="environmental_impact" id="environmental_yes" value="Yes" required>
                <label class="form-check-label" for="environmental_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="environmental_impact" id="environmental_no" value="No">
                <label class="form-check-label" for="environmental_no">No</label>
            </div>
        </div>

        <!-- Question 4.b. If yes, please explain (Hidden initially) -->
        <div id="environmental-explanation-section" class="d-none">
            <label for="environmental_explanation">4.b. If yes, please explain:</label>
            <textarea name="environmental_explanation" id="environmental_explanation" class="form-control"></textarea>
        </div>

        <!-- Question 4.c. Has an exemption been authorized or an EA/EIS performed? (Hidden initially) -->
        <div id="environmental-assessment-section" class="d-none">
            <label>4.c. If this project has an actual or potential impact on the environment, has an exemption been authorized or an environmental assessment (EA) or environmental impact statement (EIS) been performed?</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="environmental_exemption" id="environmental_exemption_yes" value="Yes">
                <label class="form-check-label" for="environmental_exemption_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="environmental_exemption" id="environmental_exemption_no" value="No">
                <label class="form-check-label" for="environmental_exemption_no">No</label>
            </div>
        </div>

        <!-- Question 4.d. If yes, please explain (Hidden initially) -->
        <div id="environmental-exemption-explanation-section" class="d-none">
            <label for="environmental_exemption_explanation">4.d. If yes, please explain:</label>
            <textarea name="environmental_exemption_explanation" id="environmental_exemption_explanation" class="form-control"></textarea>
        </div>
        <!-- Question 5: Historic Place -->
        <div class="form-group">
            <label>5. Is the research performance site designated, or eligible to be designated, as a historic place? <span class="text-danger">*</span></label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="historic_place" id="historic_yes" value="Yes" required>
                <label class="form-check-label" for="historic_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="historic_place" id="historic_no" value="No">
                <label class="form-check-label" for="historic_no">No</label>
            </div>
        </div>

        <!-- Question 5.a. Explanation (Hidden initially) -->
        <div id="historic-explanation-section" class="d-none">
            <label for="historic_explanation">5.a. If yes, please explain:</label>
            <textarea name="historic_explanation" id="historic_explanation" class="form-control"></textarea>
        </div>

        <hr>

        <!-- Question 6: International Collaboration -->
        <div class="form-group">
            <label>6. Does this project involve activities outside of the United States or partnerships with international collaborators? <span class="text-danger">*</span></label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="international_collaboration" id="international_yes" value="Yes" required>
                <label class="form-check-label" for="international_yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="international_collaboration" id="international_no" value="No">
                <label class="form-check-label" for="international_no">No</label>
            </div>
        </div>

        <!-- Question 6.a. Identify Countries (Hidden initially) -->
        <div id="international-countries-section" class="d-none">
            <label for="international_countries">6.a. If yes, identify countries:</label>
            <input type="text" name="international_countries" id="international_countries" class="form-control" placeholder="Enter countries involved">
        </div>

        <!-- Question 6.b. Explanation (Hidden initially) -->
        <div id="international-explanation-section" class="d-none">
            <label for="international_explanation">6.b. Optional Explanation:</label>
            <textarea name="international_explanation" id="international_explanation" class="form-control"></textarea>
        </div>
        <!-- Attachments 7-11 -->
        <!-- Question 7: Project Summary/Abstract -->
        <div class="form-group">
            <label>7. Project Summary/Abstract:</label>
            <input type="file" name="attachment_7" id="attachment_7" class="form-control attachment-upload">
    
            <div class="attachment-actions mt-2">
                <button type="button" class="btn btn-danger btn-sm delete-attachment" data-target="attachment_7">
                    Delete Attachment
                </button>
                <button type="button" class="btn btn-info btn-sm view-attachment" data-target="attachment_7">
                    View Attachment
                </button>
            </div>
            <hr>
        </div>

        <!-- Question 8: Project Narrative -->
        <div class="form-group">
            <label>8. Project Narrative:</label>
            <input type="file" name="attachment_8" id="attachment_8" class="form-control attachment-upload">
    
            <div class="attachment-actions mt-2">
                <button type="button" class="btn btn-danger btn-sm delete-attachment" data-target="attachment_8">
                    Delete Attachment
                </button>
                <button type="button" class="btn btn-info btn-sm view-attachment" data-target="attachment_8">
                    View Attachment
                </button>
            </div>
            <hr>
        </div>

        <!-- Question 9: Bibliography & References Cited -->
        <div class="form-group">
            <label>9. Bibliography & References Cited:</label>
            <input type="file" name="attachment_9" id="attachment_9" class="form-control attachment-upload">
    
            <div class="attachment-actions mt-2">
                <button type="button" class="btn btn-danger btn-sm delete-attachment" data-target="attachment_9">
                    Delete Attachment
                </button>
                <button type="button" class="btn btn-info btn-sm view-attachment" data-target="attachment_9">
                    View Attachment
                </button>
            </div>
            <hr>
        </div>

        <!-- Question 10: Facilities & Other Resources -->
        <div class="form-group">
            <label>10. Facilities & Other Resources:</label>
            <input type="file" name="attachment_10" id="attachment_10" class="form-control attachment-upload">
    
            <div class="attachment-actions mt-2">
                <button type="button" class="btn btn-danger btn-sm delete-attachment" data-target="attachment_10">
                    Delete Attachment
                </button>
                <button type="button" class="btn btn-info btn-sm view-attachment" data-target="attachment_10">
                    View Attachment
                </button>
            </div>
            <hr>
        </div>

        <!-- Question 11: Equipment -->
        <div class="form-group">
            <label>11. Equipment:</label>
            <input type="file" name="attachment_11" id="attachment_11" class="form-control attachment-upload">
    
            <div class="attachment-actions mt-2">
                <button type="button" class="btn btn-danger btn-sm delete-attachment" data-target="attachment_11">
                    Delete Attachment
                </button>
                <button type="button" class="btn btn-info btn-sm view-attachment" data-target="attachment_11">
                    View Attachment
                </button>
            </div>
            <hr>
        </div>
        <div class="form-group">
            <label>12. Other Attachments (Max 10):</label>
            <input type="file" id="other_attachments_input" class="form-control attachment-upload" multiple>
            
            <!-- Uploaded Files List -->
            <div id="other_attachments_list" class="mt-2"></div>
        
            <hr>
        </div>
        <br>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<!-- JavaScript to Handle Conditional Fields -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        let humanSubjectsYes = document.getElementById("human_subjects_yes");
        let humanSubjectsNo = document.getElementById("human_subjects_no");
        let projectExemptYes = document.getElementById("project_exempt_yes");
        let projectExemptNo = document.getElementById("project_exempt_no");
        let irbPendingYes = document.getElementById("irb_pending_yes");
        let irbPendingNo = document.getElementById("irb_pending_no");
        let vertebrateYes = document.getElementById("vertebrate_yes");
        let vertebrateNo = document.getElementById("vertebrate_no");
        let iacucPendingYes = document.getElementById("iacuc_pending_yes");
        let iacucPendingNo = document.getElementById("iacuc_pending_no");
        let environmentalYes = document.getElementById("environmental_yes");
        let environmentalNo = document.getElementById("environmental_no");
        let exemptionYes = document.getElementById("environmental_exemption_yes");
        let exemptionNo = document.getElementById("environmental_exemption_no");
        let historicYes = document.getElementById("historic_yes");
        let historicNo = document.getElementById("historic_no");
        let internationalYes = document.getElementById("international_yes");
        let internationalNo = document.getElementById("international_no");
        let attachmentInput = document.getElementById("other_attachments_input");
        let attachmentList = document.getElementById("other_attachments_list");
        let maxFiles = 10;  // Maximum allowed attachments
        attachmentInput.addEventListener("change", function () {
            let files = attachmentInput.files;
            if (attachmentList.children.length + files.length > maxFiles) {
                alert("You can only upload up to 10 attachments.");
                return;
            }

            Array.from(files).forEach((file, index) => {
                let fileId = `attachment_other_${attachmentList.children.length + 1}`;
                
                let fileEntry = document.createElement("div");
                fileEntry.classList.add("attachment-entry");
                fileEntry.innerHTML = `
                    <span>${file.name}</span>
                    <button type="button" class="btn btn-danger btn-sm delete-attachment" data-target="${fileId}">
                        Delete Attachment
                    </button>
                    <button type="button" class="btn btn-info btn-sm view-attachment" data-target="${fileId}">
                        View Attachment
                    </button>
                    <input type="hidden" name="other_attachments[]" value="${file.name}" id="${fileId}">
                `;

                attachmentList.appendChild(fileEntry);
            });

            // Clear file input so users can re-select files
            attachmentInput.value = "";
        });

        // Event listener for Delete buttons
        attachmentList.addEventListener("click", function (e) {
            if (e.target.classList.contains("delete-attachment")) {
                let targetId = e.target.getAttribute("data-target");
                document.getElementById(targetId)?.remove();
                e.target.parentElement.remove();
            }
        });

        // Event listener for View buttons (Mock functionality)
        attachmentList.addEventListener("click", function (e) {
            if (e.target.classList.contains("view-attachment")) {
                let targetId = e.target.getAttribute("data-target");
                let fileName = document.getElementById(targetId)?.value;
                if (fileName) {
                    alert("Viewing: " + fileName);  // Replace this with actual file viewing logic
                }
            }
        });


        function toggleVisibility(element, condition) {
            if (condition) {
                element.classList.remove("d-none");
            } else {
                element.classList.add("d-none");
            }
        }

        // Show or hide fields based on Human Subjects selection
        document.querySelectorAll("input[name='human_subjects']").forEach(input => {
            input.addEventListener("change", function () {
                let isYes = humanSubjectsYes.checked;
                toggleVisibility(document.getElementById("project-exempt-section"), isYes);
                toggleVisibility(document.getElementById("human-assurance-section"), isYes);

                if (!isYes) {
                    document.getElementById("project_exempt_yes").checked = false;
                    document.getElementById("project_exempt_no").checked = false;
                    toggleVisibility(document.getElementById("exemption-numbers-section"), false);
                    toggleVisibility(document.getElementById("irb-review-section"), false);
                    toggleVisibility(document.getElementById("irb-approval-date-section"), false);
                    document.getElementById("human_assurance_number").value = "";
                }
            });
        });

        // Show or hide Exemption Numbers based on Project Exempt selection
        document.querySelectorAll("input[name='project_exempt']").forEach(input => {
            input.addEventListener("change", function () {
                let isYes = projectExemptYes.checked;
                toggleVisibility(document.getElementById("exemption-numbers-section"), isYes);
                toggleVisibility(document.getElementById("irb-review-section"), !isYes);
                
                if (!isYes) {
                    document.querySelectorAll("input[name='exemption_numbers']").forEach(cb => cb.checked = false);
                }
            });
        });

        // Show or hide IRB Approval Date based on IRB Pending selection
        document.querySelectorAll("input[name='irb_pending']").forEach(input => {
            input.addEventListener("change", function () {
                toggleVisibility(document.getElementById("irb-approval-date-section"), irbPendingNo.checked);
                if (!irbPendingNo.checked) {
                    document.getElementById("irb_approval_date").value = "";
                }
            });
        });
        document.querySelectorAll("input[name='vertebrate_animals']").forEach(input => {
            input.addEventListener("change", function () {
                let isYes = vertebrateYes.checked;
                toggleVisibility(document.getElementById("iacuc-review-section"), isYes);
                toggleVisibility(document.getElementById("animal-welfare-section"), isYes);

                if (!isYes) {
                    document.getElementById("iacuc_pending_yes").checked = false;
                    document.getElementById("iacuc_pending_no").checked = false;
                    toggleVisibility(document.getElementById("iacuc-approval-date-section"), false);
                    toggleVisibility(document.getElementById("animal-welfare-section"), false);
                    document.getElementById("animal_welfare_number").value = "";
                    document.getElementById("iacuc_approval_date").value = "";
                }
            });
        });

        // Show or hide IACUC Approval Date based on IACUC Pending selection
        document.querySelectorAll("input[name='iacuc_pending']").forEach(input => {
            input.addEventListener("change", function () {
                let isNo = iacucPendingNo.checked;
                toggleVisibility(document.getElementById("iacuc-approval-date-section"), isNo);
                if (!isNo) {
                    document.getElementById("iacuc_approval_date").value = "";
                }
            });
        });
        document.querySelectorAll("input[name='environmental_impact']").forEach(input => {
            input.addEventListener("change", function () {
                let isYes = environmentalYes.checked;
                toggleVisibility(document.getElementById("environmental-explanation-section"), isYes);
                toggleVisibility(document.getElementById("environmental-assessment-section"), isYes);

                if (!isYes) {
                    document.getElementById("environmental_explanation").value = "";
                    document.getElementById("environmental_exemption_yes").checked = false;
                    document.getElementById("environmental_exemption_no").checked = false;
                    toggleVisibility(document.getElementById("environmental-exemption-explanation-section"), false);
                }
            });
        });

        // Show explanation field when "Yes" is selected for exemption or EA/EIS
        document.querySelectorAll("input[name='environmental_exemption']").forEach(input => {
            input.addEventListener("change", function () {
                toggleVisibility(document.getElementById("environmental-exemption-explanation-section"), exemptionYes.checked);
                if (!exemptionYes.checked) {
                    document.getElementById("environmental_exemption_explanation").value = "";
                }
            });
        });
        document.querySelectorAll("input[name='historic_place']").forEach(input => {
            input.addEventListener("change", function () {
                toggleVisibility(document.getElementById("historic-explanation-section"), historicYes.checked);
                if (!historicYes.checked) {
                    document.getElementById("historic_explanation").value = "";
                }
            });
        });

        // Show country & explanation fields when "Yes" is selected for International Collaboration
        document.querySelectorAll("input[name='international_collaboration']").forEach(input => {
            input.addEventListener("change", function () {
                let isYes = internationalYes.checked;
                toggleVisibility(document.getElementById("international-countries-section"), isYes);
                toggleVisibility(document.getElementById("international-explanation-section"), isYes);

                if (!isYes) {
                    document.getElementById("international_countries").value = "";
                    document.getElementById("international_explanation").value = "";
                }
            });
        });
        document.querySelectorAll(".delete-attachment").forEach(button => {
            button.addEventListener("click", function () {
                let targetId = this.getAttribute("data-target");
                document.getElementById(targetId).value = "";  // Clear input field
            });
        });

        document.querySelectorAll(".view-attachment").forEach(button => {
            button.addEventListener("click", function () {
                let targetId = this.getAttribute("data-target");
                let fileInput = document.getElementById(targetId);
                
                if (fileInput.files.length > 0) {
                    let fileURL = URL.createObjectURL(fileInput.files[0]);
                    window.open(fileURL, "_blank");
                } else {
                    alert("No file attached to view.");
                }
            });
        });
    });
</script>

{% endblock %}
