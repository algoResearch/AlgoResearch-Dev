<!-- Add Cost Type Modal -->
<div class="modal fade" id="addCostTypeModal" tabindex="-1" aria-labelledby="addCostTypeModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{% url 'add_cost_type' fund.fund_id %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="addCostTypeModalLabel">Add Cost Type</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="costTypeName" class="form-label">Name</label>
            <input type="text" class="form-control" id="costTypeName" name="name" required>
          </div>
          <div class="mb-3">
            <label for="costTypeCategory" class="form-label">Category</label>
            <select class="form-select" id="costTypeCategory" name="category">
                {% for category_group in cost_categories.values %}
                  {% for key, label in category_group %}
                    <option value="{{ key }}">{{ label }}</option>
                  {% endfor %}
                {% endfor %}
            </select>              
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Add Cost Entry Modal -->
<div class="modal fade" id="addCostEntryModal" tabindex="-1" aria-labelledby="addCostEntryModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{% url 'add_cost_entry' fund.fund_id %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Add Entry</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="is_idc" id="entryModalIsIDC" value="false">
          <div class="mb-3">
            <label for="entryCostType" class="form-label">Cost Type</label>
            <select class="form-select" id="entryCostType" name="cost_type">
              {% for cost_type in all_cost_types %}
                <option value="{{ cost_type.id }}" data-idc="{{ cost_type.is_idc|yesno:'true,false' }}">{{ cost_type.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" name="description" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Budget</label>
            <input type="number" step="0.01" name="budget" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Add Entry</button>
        </div>
      </form>
    </div>
  </div>
</div>
