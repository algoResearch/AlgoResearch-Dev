{% extends "admin/base_admin_dashboard.html" %}
{% block title %}Create Certification{% endblock %}

{% block content %}
<div class="container">
    <h2>Create Certification in "{{ folder.name }}"</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Add Certification</button>
    </form>
</div>
{% endblock %}
