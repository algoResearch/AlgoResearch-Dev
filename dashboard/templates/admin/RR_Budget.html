{% extends "admin/base_admin_dashboard.html" %}
{% block content %}
<div class="container">
    <h2>RESEARCH & RELATED BUDGET</h2>

    <form method="POST" action="{% url 'RR_Budget_Answers' %}">
        {% csrf_token %}
        <input type="hidden" id="period_count" name="period_count" value="1">
        
        <div id="budget-periods">
            {% for i in "12345"|make_list %}
            <div class="budget-period card p-4 mb-4" data-period="{{ i }}" {% if i != "1" %} style="display: none;" {% endif %}>
                <h3>Budget Period <span class="period-number">{{ i }}</span></h3>

                <div class="form-group">
                    <label for="uei_{{ i }}">Unique Entity Identifier (UEI):</label>
                    <input type="text" name="uei_{{ i }}" id="uei_{{ i }}" class="form-control period-input">
                </div>
    
                <div class="form-group">
                    <label for="organization_name_{{ i }}">Organization Name:</label>
                    <input type="text" name="organization_name_{{ i }}" class="form-control" value="{{ organization.name }}" readonly>
                </div>

                <div class="form-group">
                    <label>Budget Type:</label>
                    <div>
                        <label class="radio-inline">
                            <input type="radio" name="budget_type_{{ i }}" value="project" class="period-input">
                            Project
                        </label>
    
                        <label class="radio-inline">
                            <input type="radio" name="budget_type_{{ i }}" value="subaward" class="period-input">
                            Subaward / Consortium
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="start_date_{{ i }}">Start Date:</label>
                    <input type="date" name="start_date_{{ i }}" id="start_date_{{ i }}" class="form-control period-input">
                </div>
    
                <div class="form-group">
                    <label for="end_date_{{ i }}">End Date:</label>
                    <input type="date" name="end_date_{{ i }}" id="end_date_{{ i }}" class="form-control period-input">
                </div>

                <!-- Key Personnel Section for This Budget Period -->
                <h3>Part A: Senior / Key Persons</h3>
                <div id="senior-key-persons-{{ i }}" class="senior-key-persons">
                    <button type="button" class="btn btn-secondary add-person" data-period="{{ i }}">Add Another Person</button>

                    <div class="person-entry card p-3 mb-3">
                        <h5>Person 1</h5>

                        <div class="form-group">
                            <label>First Name:</label>
                            <input type="text" name="first_name_{{ i }}[]" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Middle Name (Optional):</label>
                            <input type="text" name="middle_name_{{ i }}[]" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Last Name:</label>
                            <input type="text" name="last_name_{{ i }}[]" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Base Salary:</label>
                            <input type="number" name="base_salary_{{ i }}[]" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Calendar Months:</label>
                            <input type="number" name="calendar_months_{{ i }}[]" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Requested Salary:</label>
                            <input type="number" name="requested_salary_{{ i }}[]" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Fringe Benefits:</label>
                            <input type="number" name="fringe_benefits_{{ i }}[]" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Funds Requested (Auto-Calculated):</label>
                            <input type="text" name="funds_requested_{{ i }}[]" class="form-control funds-requested" readonly>
                        </div>

                        <div class="form-group">
                            <label>Project Role:</label>
                            <input type="text" name="project_role_{{ i }}[]" class="form-control">
                        </div>

                        <button type="button" class="btn btn-danger remove-person">Remove</button>
                        <hr>
                    </div>
                </div>

                <!-- Additional Senior Key Person Attachment -->
                <h3>Additional Senior Key Person</h3>
                <div class="card p-3 mb-3">
                    <div class="form-group">
                        <label for="additional_senior_attachment_{{ i }}">Attach File:</label>
                        <input type="file" name="additional_senior_attachment_{{ i }}" id="additional_senior_attachment_{{ i }}" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="total_funds_requested_attachment_{{ i }}">Total Funds Requested (File):</label>
                        <input type="number" name="total_funds_requested_attachment_{{ i }}" id="total_funds_requested_attachment_{{ i }}" class="form-control" step="0.01">
                    </div>
                </div>

                <!-- Total Senior/Key Persons Funds -->
                <div class="form-group">
                    <label>Total Senior / Key Persons Funds Requested:</label>
                    <input type="text" class="form-control" id="total_funds_senior_key_persons_{{ i }}" readonly>
                </div>

            </div>
            {% endfor %}
        </div>

        <button type="button" id="add-budget-period" class="btn btn-secondary">Add Another Budget Period</button>
        <button type="submit" class="btn btn-primary">Submit and View RR Budget Answered</button>    
    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    let maxPeriods = 5;
    let currentPeriod = 1;
    let periodCountInput = document.getElementById("period_count");

    function updatePeriodCount() {
        let visiblePeriods = document.querySelectorAll(".budget-period:not([style*='display: none'])").length;
        periodCountInput.value = visiblePeriods;
    }

    document.getElementById("add-budget-period").addEventListener("click", function () {
        if (currentPeriod < maxPeriods) {
            currentPeriod++;
            let newPeriod = document.querySelector(`.budget-period[data-period='${currentPeriod}']`);
            if (newPeriod) {
                newPeriod.style.display = "block";

                newPeriod.querySelectorAll("input, select").forEach(input => {
                    input.removeAttribute("disabled");
                });

                updatePeriodCount();
            }
        }

        if (currentPeriod === maxPeriods) {
            this.style.display = "none";
        }
    });

    document.querySelectorAll(".add-person").forEach(button => {
        button.addEventListener("click", function () {
            let periodIndex = this.getAttribute("data-period");
            let container = document.getElementById(`senior-key-persons-${periodIndex}`);

            let newPerson = document.createElement("div");
            newPerson.classList.add("person-entry", "card", "p-3", "mb-3");
            newPerson.innerHTML = `
                <h5>New Person</h5>
                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" name="first_name_${periodIndex}[]" class="form-control">
                </div>
                <div class="form-group">
                    <label>Last Name:</label>
                    <input type="text" name="last_name_${periodIndex}[]" class="form-control">
                </div>
                <button type="button" class="btn btn-danger remove-person">Remove</button>
                <hr>
            `;

            container.appendChild(newPerson);

            newPerson.querySelector(".remove-person").addEventListener("click", function () {
                newPerson.remove();
            });
        });
    });

    document.querySelector("form").addEventListener("submit", function (e) {
        document.querySelectorAll(".budget-period").forEach(period => {
            if (period.style.display === "none") {
                period.querySelectorAll("input, select").forEach(input => {
                    input.setAttribute("disabled", "true");
                    input.removeAttribute("required");
                });
            } else {
                period.querySelectorAll("input, select").forEach(input => {
                    input.disabled = false;
                });
            }
        });

        updatePeriodCount();
    });
});
</script>

{% endblock %}
