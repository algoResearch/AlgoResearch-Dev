{% extends "admin/base_admin_dashboard.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Test Form 2</h2>
    {% if selected_form %}
            <form id="test-form-2" method="POST" enctype="multipart/form-data"
                action="{% url 'save_filled_form' org_id=org_id form_id=selected_form.id %}">
        {% else %}
            <p class="text-danger">Error: No form selected.</p>
        {% endif %}
        {% csrf_token %}

        <div class="row">
            <div class="col-md-12">
                <div class="form-group">
                    <label>1. Project Name <span class="text-danger">*</span></label>
                    <input type="text" name="project_name" class="form-control" required>
                </div>
            </div>

            <div class="col-md-12">
                <div class="form-group">
                    <label>2. Project Description</label>
                    <textarea name="project_description" class="form-control"></textarea>
                </div>
            </div>

            <div class="col-md-12">
                <div class="form-group">
                    <label>3. Expected Completion Date</label>
                    <input type="date" name="completion_date" class="form-control">
                </div>
            </div>

            <div class="col-md-12">
                <div class="form-group">
                    <label>4. Have you received funding?</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="funding" value="yes" id="funding_yes">
                        <label class="form-check-label" for="funding_yes">Yes</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="funding" value="no" id="funding_no">
                        <label class="form-check-label" for="funding_no">No</label>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}
