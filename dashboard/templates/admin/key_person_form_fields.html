<div class="row">
    <div class="col-md-3">
        <label for="prefix_{{ index }}">Prefix</label>
        <select name="prefix[]" id="prefix_{{ index }}" class="form-control">
            <option value="">Select</option>
            <option value="Dr.">Dr.</option>
            <option value="Mr.">Mr.</option>
            <option value="Mrs.">Mrs.</option>
            <option value="Ms.">Ms.</option>
        </select>
    </div>
    <div class="col-md-3">
        <label for="first_name_{{ index }}">First Name <span class="text-danger">*</span></label>
        <input type="text" name="first_name[]" id="first_name_{{ index }}" class="form-control" required>
    </div>
    <div class="col-md-3">
        <label for="middle_name_{{ index }}">Middle Name</label>
        <input type="text" name="middle_name[]" id="middle_name_{{ index }}" class="form-control">
    </div>
    <div class="col-md-3">
        <label for="last_name_{{ index }}">Last Name <span class="text-danger">*</span></label>
        <input type="text" name="last_name[]" id="last_name_{{ index }}" class="form-control" required>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <label for="position_{{ index }}">Position Title</label>
        <input type="text" name="position[]" id="position_{{ index }}" class="form-control">
    </div>
    <div class="col-md-6">
        <label for="department_{{ index }}">Department</label>
        <input type="text" name="department[]" id="department_{{ index }}" class="form-control">
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <label for="organization_{{ index }}">Organization Name</label>
        <input type="text" name="organization[]" id="organization_{{ index }}" class="form-control">
    </div>
    <div class="col-md-6">
        <label for="division_{{ index }}">Division</label>
        <input type="text" name="division[]" id="division_{{ index }}" class="form-control">
    </div>
</div>

<!-- Address -->
<div class="row">
    <div class="col-md-6">
        <label for="street1_{{ index }}">Street 1 <span class="text-danger">*</span></label>
        <input type="text" name="street1[]" id="street1_{{ index }}" class="form-control" required>
    </div>
    <div class="col-md-6">
        <label for="street2_{{ index }}">Street 2</label>
        <input type="text" name="street2[]" id="street2_{{ index }}" class="form-control">
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <label for="city_{{ index }}">City <span class="text-danger">*</span></label>
        <input type="text" name="city[]" id="city_{{ index }}" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label for="state_{{ index }}">State <span class="text-danger">*</span></label>
        <input type="text" name="state[]" id="state_{{ index }}" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label for="zip_{{ index }}">Zip/Postal Code <span class="text-danger">*</span></label>
        <input type="text" name="zip[]" id="zip_{{ index }}" class="form-control" required>
    </div>
</div>

<!-- Contact Info -->
<div class="row">
    <div class="col-md-6">
        <label for="phone_{{ index }}">Phone <span class="text-danger">*</span></label>
        <input type="tel" name="phone[]" id="phone_{{ index }}" class="form-control" required>
    </div>
    <div class="col-md-6">
        <label for="fax_{{ index }}">Fax</label>
        <input type="tel" name="fax[]" id="fax_{{ index }}" class="form-control">
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <label for="email_{{ index }}">Email <span class="text-danger">*</span></label>
        <input type="email" name="email[]" id="email_{{ index }}" class="form-control" required>
    </div>
    <div class="col-md-6">
        <label for="credentials_{{ index }}">Credentials (e.g., Agency Login)</label>
        <input type="text" name="credentials[]" id="credentials_{{ index }}" class="form-control">
    </div>
</div>

<!-- Attachments -->
<div class="form-group">
    <label>Biographical Sketch (Required)</label>
    <input type="file" name="bio_sketch_{{ index }}" class="form-control" required>
</div>
<div class="form-group">
    <label>Attach Current & Pending Support</label>
    <input type="file" name="pending_support_{{ index }}" class="form-control">
</div>
