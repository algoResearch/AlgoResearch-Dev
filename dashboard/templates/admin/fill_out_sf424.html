{% extends "admin/base_admin_dashboard.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3">
            <h4>Form Navigation</h4>
            <div class="list-group">
                {% for form in forms %}
                    <a href="#" class="list-group-item list-group-item-action form-link"
                       data-form-url="{{ form.url }}" data-pages="{{ form.pages|length }}">
                        <i class="fas fa-folder-open"></i> {{ form.name }}
                    </a>
                    <div class="page-list" style="display: none; padding-left: 15px;">
                        {% for page_num in form.pages %}
                            <a href="#" class="list-group-item list-group-item-action form-page-link"
                               data-form-url="{{ form.url }}" data-page="{{ page_num }}">
                                - Page {{ page_num }}
                            </a>
                        {% endfor %}
                    </div>
                {% endfor %}
            </div>
        </div>

        <!-- Adobe Embed API Viewer -->
        <div class="col-md-9">
            <h2>Fill Out Forms</h2>
            <p><strong>PDF URL:</strong> <span id="debug-pdf-url"></span></p>
            <div id="adobe-dc-view" style="width: 100%; height: 700px; border: 1px solid #ccc;"></div>
        </div>
    </div>
</div>

<!-- Adobe Embed API Script -->
<script src="https://documentservices.adobe.com/view-sdk/viewer.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        let adobeDCView;
        let currentPDF = "";

        function loadPDF(pdfUrl, pageNumber = 1) {
            document.getElementById("debug-pdf-url").innerText = pdfUrl;

            if (currentPDF === pdfUrl) {
                return;  // Prevent unnecessary reloads
            }

            currentPDF = pdfUrl;
            document.getElementById("adobe-dc-view").innerHTML = "";  // Reset Adobe Viewer

            adobeDCView = new AdobeDC.View({
                clientId: "fa3534b9d3a846229ff4531dbb6b5a55",
                divId: "adobe-dc-view"
            });

            adobeDCView.previewFile({
                content: { location: { url: pdfUrl } },
                metaData: { fileName: pdfUrl.split('/').pop() }
            }, { 
                embedMode: "FULL_WINDOW",
                enableFormFilling: true
            });
        }

        // Load SF-424 as default
        loadPDF("{{ default_pdf_url }}", 1);

        // Expand pages when a form is clicked
        document.querySelectorAll(".form-link").forEach(formLink => {
            formLink.addEventListener("click", function (e) {
                e.preventDefault();
                let formUrl = this.getAttribute("data-form-url");
                let pageList = this.nextElementSibling;

                document.querySelectorAll(".page-list").forEach(list => list.style.display = "none");  // Collapse others
                pageList.style.display = pageList.style.display === "none" ? "block" : "none";  // Toggle current list

                loadPDF(formUrl, 1);
            });
        });

        // Handle page selection
        document.querySelectorAll(".form-page-link").forEach(pageLink => {
            pageLink.addEventListener("click", function (e) {
                e.preventDefault();
                let pdfUrl = this.getAttribute("data-form-url");
                let pageNumber = parseInt(this.getAttribute("data-page"));
                loadPDF(pdfUrl, pageNumber);
            });
        });
    });
</script>

{% endblock %}
