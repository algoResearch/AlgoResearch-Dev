{% extends "admin/base_admin_dashboard.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3">
            <h4>Form Navigation</h4>
            <div class="list-group">
                {% for form in forms %}
                    <a href="#" class="list-group-item list-group-item-action active">{{ form.name }}</a>
                    {% for page_num in form.pages %}
                        <a href="#" class="list-group-item list-group-item-action form-page-link" 
                           data-form-url="{{ form.url }}" 
                           data-page="{{ page_num }}">
                            - Page {{ page_num }}
                        </a>
                    {% endfor %}
                {% endfor %}
            </div>
        </div>

        <!-- Adobe Embed API Viewer -->
        <div class="col-md-9">
            <h2>Fill Out Forms</h2>
            <p><strong>PDF URL:</strong> <span id="debug-pdf-url"></span></p>
            <div id="adobe-dc-view" style="width: 100%; height: 700px; border: 1px solid #ccc;"></div>
        </div>
    </div>
</div>

<!-- Adobe Embed API Script -->
<script src="https://documentservices.adobe.com/view-sdk/viewer.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        let adobeDCView;
        
        function loadPDF(pdfUrl, pageNumber) {
            document.getElementById("debug-pdf-url").innerText = pdfUrl;
            
            if (!adobeDCView) {
                adobeDCView = new AdobeDC.View({
                    clientId: "fa3534b9d3a846229ff4531dbb6b5a55",
                    divId: "adobe-dc-view"
                });
            }

            adobeDCView.previewFile({
                content: { location: { url: pdfUrl } },
                metaData: { fileName: pdfUrl.split('/').pop() }
            }, { 
                embedMode: "FULL_WINDOW",
                enableFormFilling: true,
                defaultViewMode: "FIT_PAGE",
                defaultPage: pageNumber
            });
        }

        // Default PDF load (SF-424 form)
        loadPDF("{{ default_pdf_url }}", 1);

        // Handle page selection
        document.querySelectorAll(".form-page-link").forEach(link => {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                let pdfUrl = this.getAttribute("data-form-url");
                let pageNumber = parseInt(this.getAttribute("data-page"));
                loadPDF(pdfUrl, pageNumber);
            });
        });
    });
</script>

{% endblock %}
