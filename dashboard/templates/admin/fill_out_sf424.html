{% extends "admin/base_admin_dashboard.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Fill Out SF-424 Form</h2>

    <!-- SF-424 Form Fields -->
    <form id="sf424Form" class="mt-4">
        {% for field in form_fields %}
            <div class="form-group">
                <label>{{ field.name|title }}</label>

                {% if field.type == "checkbox" %}
                    <!-- ✅ Checkbox -->
                    <input type="checkbox" name="{{ field.name }}" value="Yes" class="form-check-input">
                {% elif field.type == "dropdown" %}
                    <!-- ✅ Dropdown -->
                    <select name="{{ field.name }}" class="form-control">
                        {% for option in field.options %}
                            <option value="{{ option }}">{{ option }}</option>
                        {% endfor %}
                    </select>
                {% else %}
                    <!-- ✅ Text Field -->
                    <input type="text" name="{{ field.name }}" class="form-control">
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="button" id="savePDF" class="btn btn-success">Save Form Data & Download</button>
    </form>
</div>

<script>
    document.getElementById("savePDF").addEventListener("click", function () {
        let formData = {};

        // ✅ Collect all form values
        document.querySelectorAll("#sf424Form input, #sf424Form select").forEach(input => {
            if (input.type === "checkbox") {
                formData[input.name] = input.checked ? "Yes" : "Off";
            } else {
                formData[input.name] = input.value;
            }
        });

        // ✅ Send data to backend
        fetch("{% url 'fill_sf424_form' org_id=org_id form_id=pdf_template.id %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.blob())
        .then(blob => {
            // ✅ Create download link
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Completed_SF424.pdf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        })
        .catch(error => console.error("Error saving PDF:", error));
    });
</script>
{% endblock %}
