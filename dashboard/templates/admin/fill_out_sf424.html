{% extends "admin/base_admin_dashboard.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Fill Out SF-424 Form</h2>

    <!-- ✅ Adobe PDF Embed API Container -->
    <div id="adobe-dc-view" style="width: 100%; height: 700px;"></div>

    <button type="button" id="savePDF" class="btn btn-success mt-3">Save Form Data & Download</button>
</div>

<!-- ✅ Adobe Embed API Script -->
<script src="https://documentservices.adobe.com/view-sdk/viewer.js"></script>
<script>
    document.getElementById("savePDF").addEventListener("click", function () {
        if (!adobeSaveApi) {
            console.error("Adobe Save API not initialized.");
            return;
        }

        adobeSaveApi.getPDF().then(pdfBlob => {
            let formData = new FormData();
            formData.append("edited_pdf", pdfBlob, "Completed_SF424.pdf");

            // ✅ Ensure form_id exists before calling the URL
            {% if form_id %}
                let saveUrl = "{% url 'fill_and_download_pdf' org_id=org_id form_id=form_id %}";
            {% else %}
                console.error("Error: form_id is missing.");
                return;
            {% endif %}

            fetch(saveUrl, {
                method: "POST",
                headers: { "X-CSRFToken": "{{ csrf_token }}" },
                body: formData
            })
            .then(response => response.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "Completed_SF424.pdf";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            })
            .catch(error => console.error("Error saving PDF:", error));
        }).catch(error => console.error("Error exporting PDF:", error));
    });
</script>


{% endblock %}
