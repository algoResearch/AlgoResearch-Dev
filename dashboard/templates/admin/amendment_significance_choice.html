{% extends "admin/base_admin_dashboard.html" %}
{% block content %}
<div class="container mt-5">
    <h3>Amendment Type</h3>
    <p>Please select whether this amendment includes significant changes.</p>
    <form method="POST">
        {% csrf_token %}
        <div class="form-check">
            <input class="form-check-input" type="radio" name="change_type" value="significant" id="significant" required>
            <label class="form-check-label" for="significant">Significant Change</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="change_type" value="non_significant" id="non_significant">
            <label class="form-check-label" for="non_significant">Non-Significant Change</label>
        </div>
        <button type="submit" class="btn btn-success mt-3">Submit Amendment</button>
    </form>
</div>
{% endblock %}
