{% extends "admin/base_admin_dashboard.html" %}
{% block content %}
<div class="container-fluid py-4">
    <h2>Create a New Form</h2>

    <!-- Success Message -->
    {% if message %}
    <div class="alert alert-success" role="alert">
        {{ message }}
    </div>
    {% endif %}

    <form id="create-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Form Name Input -->
        <div class="form-group">
            <label for="form_name">Form Name:</label>
            <input type="text" id="form_name" name="form_name" class="form-control" required>
        </div>

        <!-- Form Description Input -->
        <div class="form-group">
            <label for="form_description">Description:</label>
            <textarea id="form_description" name="form_description" class="form-control" rows="4"></textarea>
        </div>

        <!-- PDF or DOCX Template Upload -->
        <div class="form-group">
            <label for="form_file">Upload Form (PDF or DOCX):</label>
            <input type="file" id="form_file" name="form_file" class="form-control-file" accept=".pdf,.docx" required>
            <small class="form-text text-muted">Upload a PDF or DOCX form that users can fill out.</small>
        </div>

        <!-- User Selection -->
        <div class="form-group">
            <label for="user_selection">Assign Form To:</label>
            <select id="user_selection" name="user_selection" class="form-control" required>
                <option value="all">All Users</option>
                <option value="specific">Specific Users</option>
            </select>
        </div>

        <!-- Specific User Selection (Hidden Initially) -->
        <div id="specific-users-section" class="form-group" style="display:none;">
            <label for="specific_users">Select Users:</label>
            <select id="specific_users" name="specific_users[]" class="form-control" multiple>
                {% for user in users %}
                <option value="{{ user.id }}">{{ user.first_name }} {{ user.last_name }} ({{ user.email }})</option>
                {% endfor %}
            </select>
            <small class="form-text text-muted">Hold Ctrl (Windows) or Cmd (Mac) to select multiple users.</small>
        </div>

        <!-- Submit Form -->
        <button type="submit" class="btn btn-success mt-3">Create Form</button>
    </form>
</div>

<script>
    // Show/hide specific users section based on selection
    document.getElementById('user_selection').addEventListener('change', function() {
        const specificUsersSection = document.getElementById('specific-users-section');
        if (this.value === 'specific') {
            specificUsersSection.style.display = 'block';
        } else {
            specificUsersSection.style.display = 'none';
        }
    });
</script>
{% endblock %}
