<div class="container-fluid py-4">
    <div class="card">
        <div class="card-body">
            <h2 class="form-title text-center">Procedure Relationships</h2>
            <p class="text-muted text-center">Describe the procedure in detail.</p>

            <form id="procedure_relationships-form">
                {% csrf_token %}

                <!-- Procedure Description -->
                <div class="form-group mb-3">
                    <label for="procedure_description"><strong>Describe the Procedure and the Relationship</strong></label>
                    <textarea id="procedure_description" name="procedure_description" class="form-control" rows="6" required>{{ protocol.procedure_relationships.procedure_description }}</textarea>
                </div>

                <!-- Navigation Buttons -->
                <div class="d-flex justify-content-between mt-4">
                    <button type="button" class="btn btn-secondary" onclick="prevMiniStep()">Previous</button>
                    <button type="button" class="btn btn-primary" onclick="saveCurrentStep(nextMiniStep)">Save & Next</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    function saveCurrentStep(callback) {
        let formData = new FormData(document.getElementById("procedure_relationships-form"));
        formData.append("completed_step", "procedure_relationships"); // Mark step as completed

        fetch("{% url 'protocol_info' org_id=org_id protocol_id=protocol.id %}", {
            method: "POST",
            headers: { "X-CSRFToken": "{{ csrf_token }}" },
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                markMiniStepCompleted("procedure_relationships");
                callback();
            } else {
                console.error("Failed to save procedure relationships:", data.message);
            }
        })
        .catch(error => console.error("Error saving procedure relationships:", error));
    }
</script>
