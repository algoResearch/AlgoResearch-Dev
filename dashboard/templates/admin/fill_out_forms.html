{% extends "admin/base_admin_dashboard.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Fill Out SF-424 Form</h2>

    <!-- PDF Navigation -->
    <div class="pdf-controls">
        <button id="prevPage" class="btn btn-secondary">Previous Page</button>
        <span>Page <span id="pageNum">1</span> of <span id="pageCount">?</span></span>
        <button id="nextPage" class="btn btn-secondary">Next Page</button>
    </div>

    <!-- PDF Viewer -->
    <div id="pdf-container">
        <canvas id="pdf-canvas"></canvas>
    </div>

    <!-- Download Button -->
    <button id="downloadPDF" class="btn btn-primary">Download Completed Form</button>
</div>

<!-- Load pdf.js and pdf-lib -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let formFields = {};
    let pdfBytes = null;

    document.addEventListener("DOMContentLoaded", async function () {
        const url = "{% url 'view_pdf' %}";

        async function loadPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                document.getElementById("pageCount").textContent = totalPages;

                // Load the PDF bytes for form processing
                pdfBytes = await fetch(url).then(res => res.arrayBuffer());

                renderPage(currentPage);
            } catch (error) {
                console.error("Error loading PDF:", error);
            }
        }

        async function renderPage(pageNumber) {
            const page = await pdfDoc.getPage(pageNumber);
            const scale = 1.5;
            const viewport = page.getViewport({ scale });

            const canvas = document.getElementById("pdf-canvas");
            const ctx = canvas.getContext("2d");
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            // Render the PDF page
            const renderContext = { canvasContext: ctx, viewport: viewport };
            await page.render(renderContext);

            // Update page number display
            document.getElementById("pageNum").textContent = pageNumber;
        }

        document.getElementById("prevPage").addEventListener("click", function () {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        });

        document.getElementById("nextPage").addEventListener("click", function () {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        });

        document.getElementById("downloadPDF").addEventListener("click", async function () {
            try {
                if (!pdfBytes) {
                    throw new Error("PDF not loaded");
                }

                const pdfDocLib = await PDFLib.PDFDocument.load(pdfBytes);
                const form = pdfDocLib.getForm();

                for (let name in formFields) {
                    const value = formFields[name].value;
                    form.getTextField(name).setText(value);
                }

                const pdfBytesUpdated = await pdfDocLib.save();
                const blob = new Blob([pdfBytesUpdated], { type: "application/pdf" });

                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "filled_SF424.pdf";
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (error) {
                console.error("Error downloading PDF:", error);
            }
        });

        loadPDF();
    });
</script>

<style>
    .pdf-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 10px;
    }

    .pdf-controls button {
        margin: 0 10px;
    }

    #pdf-container {
        text-align: center;
    }

    canvas {
        border: 1px solid black;
    }
</style>

{% endblock %}
