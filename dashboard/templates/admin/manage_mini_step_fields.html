{% extends "admin/base_admin_dashboard.html" %}
{% block content %}

<div class="container-fluid py-4">
    <div class="card">
        <div class="card-body">
            <h2 class="text-center">Manage Fields for {{ mini_step.name }}</h2>

            <!-- ✅ Add Field Form -->
            <form id="add-field-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="field_label">Field Label</label>
                    <input type="text" id="field_label" name="field_label" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="field_type">Field Type</label>
                    <select id="field_type" name="field_type" class="form-control" required>
                        <option value="text">Text</option>
                        <option value="textarea">Textarea</option>
                        <option value="number">Number</option>
                        <option value="dropdown">Dropdown</option>
                        <option value="file">File Upload</option>
                        <option value="table">Table</option>  <!-- ✅ Table Option -->
                    </select>
                </div>

                <!-- ✅ Dropdown Options -->
                <div class="form-group" id="options-group" style="display: none;">
                    <label for="options">Dropdown Options (comma-separated)</label>
                    <input type="text" id="options" name="options" class="form-control">
                </div>

                <!-- ✅ Table Column Names -->
                <div class="form-group" id="table-group" style="display: none;">
                    <label for="column_names">Table Column Names (comma-separated)</label>
                    <input type="text" id="column_names" name="column_names" class="form-control">
                </div>

                <!-- ✅ Fixed Number of Rows -->
                <div class="form-group" id="row-group" style="display: none;">
                    <label for="fixed_rows">Fixed Rows (Leave blank for dynamic)</label>
                    <input type="number" id="fixed_rows" name="fixed_rows" class="form-control" min="1">
                </div>

                <!-- ✅ Allow Dynamic Rows -->
                <div class="form-check" id="dynamic-row-group" style="display: none;">
                    <input type="checkbox" id="allow_dynamic_rows" name="allow_dynamic_rows" class="form-check-input">
                    <label for="allow_dynamic_rows" class="form-check-label">Allow User to Add Rows</label>
                </div>

                <!-- ✅ Parent Field (For Conditional Logic) -->
                <div class="form-group">
                    <label for="parent_field">Depends on (Dropdown Field)</label>
                    <select id="parent_field" name="parent_field" class="form-control">
                        <option value="">None</option>
                        {% for dropdown in dropdown_fields %}
                        <option value="{{ dropdown.id }}">{{ dropdown.label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ✅ Trigger Condition -->
                <div class="form-group">
                    <label for="trigger_option">Triggered by Option</label>
                    <input type="text" id="trigger_option" name="trigger_option" class="form-control">
                </div>

                <div class="form-check">
                    <input type="checkbox" id="is_required" name="is_required" class="form-check-input">
                    <label for="is_required" class="form-check-label">Required Field</label>
                </div>

                <button type="submit" class="btn btn-success mt-3">Add Field</button>
            </form>

            <!-- ✅ List of Fields -->
            <h4 class="mt-4">Existing Fields</h4>
            <ul id="fields-list" class="list-group">
                {% for field in fields %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>{{ field.label }} ({{ field.get_field_type_display }})</span>
                    <button class="btn btn-sm btn-danger delete-field" data-id="{{ field.id }}">Delete</button>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // ✅ Toggle Field Inputs Based on Type
        document.getElementById("field_type").addEventListener("change", function () {
            let selectedType = this.value;
            document.getElementById("options-group").style.display = selectedType === "dropdown" ? "block" : "none";
            document.getElementById("table-group").style.display = selectedType === "table" ? "block" : "none";
            document.getElementById("row-group").style.display = selectedType === "table" ? "block" : "none";
            document.getElementById("dynamic-row-group").style.display = selectedType === "table" ? "block" : "none";
        });

        // ✅ Handle Form Submission
        document.getElementById("add-field-form").addEventListener("submit", function (e) {
            e.preventDefault();

            let formData = new FormData();
            formData.append("field_label", document.getElementById("field_label").value.trim());
            formData.append("field_type", document.getElementById("field_type").value);

            let isRequiredElement = document.getElementById("is_required");
            formData.append("is_required", isRequiredElement.checked ? "on" : "off");

            // ✅ Handle Dropdown Options
            if (document.getElementById("field_type").value === "dropdown") {
                formData.append("options", document.getElementById("options").value.trim());
            }

            // ✅ Handle Table Fields
            if (document.getElementById("field_type").value === "table") {
                formData.append("column_names", document.getElementById("column_names").value.trim());

                let fixedRows = document.getElementById("fixed_rows").value;
                formData.append("fixed_rows", fixedRows ? fixedRows : "");

                let allowDynamicRowsElement = document.getElementById("allow_dynamic_rows");
                formData.append("allow_dynamic_rows", allowDynamicRowsElement.checked ? "on" : "off");
            }

            // ✅ Handle Parent Dropdown & Trigger Condition
            let parentField = document.getElementById("parent_field").value;
            if (parentField) {
                formData.append("parent_field", parentField);
                formData.append("trigger_option", document.getElementById("trigger_option").value.trim());
            }

            fetch("{% url 'manage_mini_step_fields' mini_step.id %}", {
                method: "POST",
                headers: { "X-CSRFToken": "{{ csrf_token }}" },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    location.reload();
                } else {
                    alert("Failed to add field: " + JSON.stringify(data.errors));
                }
            })
            .catch(error => console.error("Error adding field:", error));
        });

        // ✅ Handle Field Deletion
        document.querySelectorAll(".delete-field").forEach(button => {
            button.addEventListener("click", function () {
                let fieldId = this.getAttribute("data-id");

                fetch(`/admin/manage-mini-step-fields/delete/${fieldId}/`, {
                    method: "POST",
                    headers: { 
                        "X-CSRFToken": "{{ csrf_token }}",
                        "Content-Type": "application/json"
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        location.reload();
                    } else {
                        alert("Error deleting field");
                    }
                })
                .catch(error => console.error("Error deleting field:", error));
            });
        });

        // ✅ Handle Field Visibility Based on Dropdown Selection
        function toggleDependentFields() {
            let dropdowns = document.querySelectorAll("[data-field-type='dropdown']");
            dropdowns.forEach(dropdown => {
                let selectedValue = dropdown.value;
                let dependentFields = document.querySelectorAll("[data-parent-field='" + dropdown.dataset.fieldId + "']");

                dependentFields.forEach(field => {
                    let triggerValue = field.dataset.triggerOption;
                    field.style.display = (selectedValue === triggerValue) ? "block" : "none";
                });
            });
        }

        document.querySelectorAll("[data-field-type='dropdown']").forEach(dropdown => {
            dropdown.addEventListener("change", toggleDependentFields);
        });

        toggleDependentFields();
    });
</script>

{% endblock %}
