{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                225deg, /* Reverse angle compared to researcher login */
                rgba(255,255,255,0.15) 0px,
                rgba(255,255,255,0.15) 2px,
                transparent 2px,
                transparent 20px
            );
            z-index: 0;
            pointer-events: none;
        }           
        body {
            position: relative;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F36C21;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        .login-content h2 {
            margin-bottom: 20px;
            color: #F36C21;
        }
        .login-content label {
            display: block;
            text-align: left;
            margin-bottom: 10px;
            color: #666;
        }
        .login-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-content button {
            width: 100%;
            padding: 10px;
            background-color: #F36C21;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-content button:hover {
            background-color: #F36C21;
        }
        .login-content p {
            margin-top: 20px;
            color: #666;
        }
        .login-content .error {
            color: red;
            margin-bottom: 15px;
        }
        .login-logo {
            max-width: 150px; /* Adjust as needed for your design */
            height: auto;
            margin-bottom: 20px; /* Space between the logo and the form */
        }
    </style>
</head>
<body>
    <div class="login-content">
        <img src="{% static 'img/admin-logo-s.png' %}" alt="algoRhythm Logo" class="login-logo">
        <form method="POST" action="{% url 'admin_login' %}">
            {% csrf_token %}
            
            <!-- Display general error message if present -->
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
            
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required autofocus aria-label="Username">
            {% if form.username.errors %}
                <p class="error">{{ form.username.errors }}</p>
            {% endif %}

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required aria-label="Password">
            {% if form.password.errors %}
                <p class="error">{{ form.password.errors }}</p>
            {% endif %}

            <button type="submit" class="cta">Login</button>
        </form>
    </div>
</body>
</html>
