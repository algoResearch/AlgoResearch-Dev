version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: algoresearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: branshi/algoresearch-dev:latest
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=demo-secret-key-change-in-production
      - FERNET_KEY=8iENFQ8zQY6AoCMrZvwqzEIPsrFa0JorcfgeTAdSELs=
      - DEBUG=True
      - USE_INMEMORY_CHANNELS=True
      - DEV_DATABASE_URL=postgres://postgres:postgres@db:5432/algoresearch
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
